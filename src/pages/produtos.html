<section class="dev-section pt-5 mt-5">
    <div class="container">
        <div class="dev-section-header text-center mb-5">
            <span class="dev-section-badge bg-gradient-primary">
                <i class="bi bi-box-seam"></i> Produtos
            </span>
            <h2 class="dev-section-title">Nossos Produtos</h2>
            <p class="dev-section-description">
                Soluções físicas e digitais desenvolvidas pela Miranda Soft para impulsionar seu negócio.
            </p>
        </div>

        <!-- Public Content -->
        <div id="products-content">

            <!-- Filters -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="d-flex flex-wrap gap-2 justify-content-center" id="category-filters">
                        <button class="btn btn-outline-light btn-sm rounded-pill active" data-category="all"
                            onclick="filterProducts('all', this)">
                            <i class="bi bi-grid-3x3-gap-fill"></i> Todos
                        </button>
                    </div>
                </div>
            </div>

            <!-- Products Grid (renderizado dinamicamente a partir de GET /products) -->
            <div class="row g-4" id="products-grid">
                <div class="col-12 text-center py-5 text-muted" id="products-grid-loading">
                    <div class="spinner-border spinner-border-sm me-2" role="status"></div> Carregando produtos...
                </div>
            </div>

            <!-- Pagination -->
            <nav aria-label="Paginação de produtos" class="mt-5" id="products-pagination" style="display: none;">
                <ul class="pagination justify-content-center">
                    <li class="page-item">
                        <button class="page-link bg-dark border-secondary text-light" id="products-prev" onclick="changePage(-1)">
                            <i class="bi bi-chevron-left"></i>
                        </button>
                    </li>
                    <li class="page-item">
                        <span class="page-link bg-dark border-secondary text-light" id="products-page-info">1</span>
                    </li>
                    <li class="page-item">
                        <button class="page-link bg-dark border-secondary text-light" id="products-next" onclick="changePage(1)">
                            <i class="bi bi-chevron-right"></i>
                        </button>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</section>

<!-- Product Detail Modal -->
<div id="product-modal" class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content bg-dark border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title text-white" id="modal-product-name">Produto</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row g-4">
                    <div class="col-md-5">
                        <div class="bg-secondary bg-opacity-25 rounded-3 d-flex align-items-center justify-content-center" style="min-height: 250px;" id="modal-product-image">
                            <i class="bi bi-box-seam text-secondary fs-1"></i>
                        </div>
                    </div>
                    <div class="col-md-7">
                        <span class="badge bg-primary bg-opacity-25 text-primary border border-primary border-opacity-25 mb-2" id="modal-product-category">Categoria</span>
                        <h3 class="text-white mb-3" id="modal-product-title">Nome do Produto</h3>
                        <p class="text-muted" id="modal-product-description">Descrição do produto.</p>
                        <div class="d-flex align-items-center gap-3 mt-4">
                            <span class="text-white fs-3 fw-bold" id="modal-product-price">R$ 0,00</span>
                            <span class="text-muted" id="modal-product-stock"></span>
                        </div>
                        <div class="mt-4">
                            <a href="/cotacoes" class="dev-btn dev-btn-primary">
                                <i class="bi bi-chat-left-text me-2"></i> Solicitar cotação
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .product-card {
        background: linear-gradient(145deg, rgba(30, 30, 45, 0.9), rgba(20, 20, 35, 0.95)) !important;
        border: 1px solid rgba(255, 255, 255, 0.05) !important;
        border-radius: 16px !important;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .product-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        border-color: rgba(255, 255, 255, 0.1) !important;
    }

    .product-image {
        transition: transform 0.3s ease;
    }

    .product-card:hover .product-image {
        transform: scale(1.05);
    }

    [data-category] {
        transition: all 0.2s ease;
    }

    .product-card.hidden {
        opacity: 0;
        transform: scale(0.95);
        pointer-events: none;
        position: absolute;
        visibility: hidden;
    }

    .page-link {
        transition: all 0.2s ease;
    }

    .page-link:hover {
        background: rgba(59, 130, 246, 0.1) !important;
        border-color: rgba(59, 130, 246, 0.3) !important;
        color: #fff !important;
    }

    .page-item.disabled .page-link {
        opacity: 0.5;
        pointer-events: none;
    }
</style>

<script>
    (function () {
        if (typeof window.trackEvent === 'function') {
            window.trackEvent('products_view', { page: '/produtos' });
        }

        const APP_KEY = 'msoft';
        const PAGE_SIZE = 9;
        let currentPage = 1;
        let totalPages = 1;
        let allCategories = new Set();
        let currentCategory = 'all';

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        function formatPrice(price, currency = 'BRL') {
            return Number(price || 0).toLocaleString('pt-BR', { style: 'currency', currency });
        }

        function renderProductImage(item) {
            const primaryImage = item.images && item.images.find(img => img.isPrimary) || (item.images && item.images[0]);
            if (primaryImage && primaryImage.url) {
                return `<img src="${escapeHtml(primaryImage.url)}" alt="${escapeHtml(item.name)}" class="product-image w-100 h-100 object-fit-cover" style="min-height: 200px; max-height: 220px;">`;
            }
            if (item.imageUrl) {
                return `<img src="${escapeHtml(item.imageUrl)}" alt="${escapeHtml(item.name)}" class="product-image w-100 h-100 object-fit-cover" style="min-height: 200px; max-height: 220px;">`;
            }
            return `<div class="d-flex align-items-center justify-content-center h-100" style="min-height: 200px;"><i class="bi bi-box-seam text-secondary fs-1"></i></div>`;
        }

        function renderProductCard(item) {
            const category = escapeHtml(item.category || 'Geral');
            allCategories.add(item.category || 'Geral');

            return `
                <div class="col-lg-4 col-md-6 product-card-wrapper" data-category="${escapeHtml(item.category || 'Geral')}">
                    <div class="card bg-dark border-0 h-100 product-card" onclick="openProductModal('${escapeHtml(item.uuid)}')">
                        <div class="overflow-hidden rounded-top" style="max-height: 220px;">
                            ${renderProductImage(item)}
                        </div>
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <span class="badge bg-primary bg-opacity-25 text-primary border border-primary border-opacity-25">${category}</span>
                            </div>
                            <h4 class="card-title text-white fw-bold mb-2">${escapeHtml(item.name)}</h4>
                            <p class="card-text text-muted small mb-3" style="min-height: 40px;">${escapeHtml(item.shortDesc || item.description || '').substring(0, 100)}${(item.shortDesc || item.description || '').length > 100 ? '...' : ''}</p>
                            <div class="d-flex justify-content-between align-items-center mt-auto">
                                <span class="text-white fs-5 fw-bold">${formatPrice(item.price, item.currency)}</span>
                                <span class="text-primary small"><i class="bi bi-eye me-1"></i> Ver detalhes</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCategoryFilters() {
            const container = document.getElementById('category-filters');
            if (!container || allCategories.size === 0) return;

            const existing = Array.from(container.querySelectorAll('[data-category]')).map(btn => btn.dataset.category);
            allCategories.forEach(category => {
                if (!existing.includes(category)) {
                    const btn = document.createElement('button');
                    btn.className = 'btn btn-outline-light btn-sm rounded-pill';
                    btn.dataset.category = category;
                    btn.setAttribute('onclick', `filterProducts('${escapeHtml(category).replace(/'/g, "\\'")}', this)`);
                    btn.innerHTML = `<i class="bi bi-tag"></i> ${escapeHtml(category)}`;
                    container.appendChild(btn);
                }
            });
        }

        async function loadProducts(page = 1) {
            const grid = document.getElementById('products-grid');
            const pagination = document.getElementById('products-pagination');

            try {
                const res = await window.core.fetchAPI(`/products?appKey=${APP_KEY}&page=${page}&limit=${PAGE_SIZE}`, 'GET');
                const items = (res && res.success && Array.isArray(res.data)) ? res.data : [];
                const paginationData = res && res.pagination ? res.pagination : { page: 1, pages: 1 };

                currentPage = paginationData.page;
                totalPages = paginationData.pages;

                if (items.length === 0) {
                    grid.innerHTML = `
                        <div class="col-12 text-center py-5 text-muted">
                            <i class="bi bi-inbox fs-2 d-block mb-2"></i> Nenhum produto disponível no momento.
                        </div>`;
                    pagination.style.display = 'none';
                    return;
                }

                grid.innerHTML = items.map(renderProductCard).join('');
                renderCategoryFilters();
                updatePagination();
                pagination.style.display = totalPages > 1 ? 'block' : 'none';

                applyCategoryFilter(currentCategory);
            } catch (e) {
                console.error('Failed to load products', e);
                grid.innerHTML = `
                    <div class="col-12 text-center py-5 text-muted">
                        <i class="bi bi-exclamation-triangle fs-2 d-block mb-2"></i> Não foi possível carregar os produtos.
                    </div>`;
                pagination.style.display = 'none';
            }
        }

        function updatePagination() {
            const prev = document.getElementById('products-prev');
            const next = document.getElementById('products-next');
            const info = document.getElementById('products-page-info');

            if (prev) prev.parentElement.classList.toggle('disabled', currentPage <= 1);
            if (next) next.parentElement.classList.toggle('disabled', currentPage >= totalPages);
            if (info) info.textContent = `${currentPage} / ${totalPages}`;
        }

        window.changePage = function (delta) {
            const newPage = currentPage + delta;
            if (newPage < 1 || newPage > totalPages) return;
            loadProducts(newPage);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.filterProducts = function (category, btn) {
            currentCategory = category;

            document.querySelectorAll('[data-category]').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            applyCategoryFilter(category);
        };

        function applyCategoryFilter(category) {
            document.querySelectorAll('.product-card-wrapper').forEach(card => {
                const cardCategory = card.dataset.category;
                if (category === 'all' || cardCategory === category) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        window.openProductModal = async function (uuid) {
            try {
                const res = await window.core.fetchAPI(`/products/${uuid}`, 'GET');
                if (!res || !res.success || !res.data) return;

                const item = res.data;
                const primaryImage = item.images && item.images.find(img => img.isPrimary) || (item.images && item.images[0]);

                document.getElementById('modal-product-name').textContent = escapeHtml(item.name);
                document.getElementById('modal-product-title').textContent = escapeHtml(item.name);
                document.getElementById('modal-product-category').textContent = escapeHtml(item.category || 'Geral');
                document.getElementById('modal-product-description').textContent = escapeHtml(item.description || 'Sem descrição disponível.');
                document.getElementById('modal-product-price').textContent = formatPrice(item.price, item.currency);
                document.getElementById('modal-product-stock').textContent = item.stock !== undefined ? `${item.stock} em estoque` : '';

                const imageContainer = document.getElementById('modal-product-image');
                if (primaryImage && primaryImage.url) {
                    imageContainer.innerHTML = `<img src="${escapeHtml(primaryImage.url)}" alt="${escapeHtml(item.name)}" class="img-fluid rounded-3">`;
                } else if (item.imageUrl) {
                    imageContainer.innerHTML = `<img src="${escapeHtml(item.imageUrl)}" alt="${escapeHtml(item.name)}" class="img-fluid rounded-3">`;
                } else {
                    imageContainer.innerHTML = `<i class="bi bi-box-seam text-secondary fs-1"></i>`;
                }

                const modal = new bootstrap.Modal(document.getElementById('product-modal'));
                modal.show();

                if (typeof window.trackEvent === 'function') {
                    window.trackEvent('product_view', { product_uuid: uuid, product_name: item.name });
                }
            } catch (e) {
                console.error('Failed to load product details', e);
            }
        };

        loadProducts();
    })();
</script>
