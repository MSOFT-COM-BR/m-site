<section class="dev-section pt-5 mt-5">
    <div class="container">
        <div class="dev-section-header text-center mb-5">
            <span class="dev-section-badge bg-gradient-primary">
                <i class="bi bi-shop"></i> Marketplace
            </span>
            <h2 class="dev-section-title">Marketplace de Apps</h2>
            <p class="dev-section-description">
                Descubra apps gratuitos e premium para turbinar seus projetos.
            </p>
        </div>

        <!-- Public Content -->
        <div id="marketplace-content">

            <!-- Filters -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="d-flex flex-wrap gap-2 justify-content-center">
                        <button class="btn btn-outline-light btn-sm rounded-pill active" data-filter="all"
                            onclick="filterApps('all', this)">
                            <i class="bi bi-grid-3x3-gap-fill"></i> Todos
                        </button>
                        <button class="btn btn-outline-light btn-sm rounded-pill" data-filter="free"
                            onclick="filterApps('free', this)">
                            <i class="bi bi-gift-fill"></i> Gratuitos
                        </button>
                        <button class="btn btn-outline-light btn-sm rounded-pill" data-filter="one-time"
                            onclick="filterApps('one-time', this)">
                            <i class="bi bi-bag-check"></i> Compra Única
                        </button>
                        <button class="btn btn-outline-light btn-sm rounded-pill" data-filter="subscription"
                            onclick="filterApps('subscription', this)">
                            <i class="bi bi-arrow-repeat"></i> Assinatura
                        </button>
                    </div>
                </div>
            </div>

            <!-- Apps Grid (renderizado dinamicamente a partir de GET /catalog) -->
            <div class="row g-4" id="apps-grid">
                <div class="col-12 text-center py-5 text-muted" id="apps-grid-loading">
                    <div class="spinner-border spinner-border-sm me-2" role="status"></div> Carregando catálogo...
                </div>
            </div>

            <div class="text-center mt-5">
                <a href="/apps" class="btn btn-outline-light rounded-pill px-4">
                    <i class="bi bi-arrow-left"></i> Voltar para Apps
                </a>
            </div>
        </div>



    </div>
</section>

<!-- Purchase Modal -->
<div id="purchase-modal" class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title text-white">
                    <i class="bi bi-cart-check me-2"></i>
                    <span id="modal-app-name">Consultar produto</span>
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center py-4">
                <div id="modal-icon" class="display-3 mb-3"></div>
                <h4 class="text-white" id="modal-title">App Name</h4>
                <p class="text-muted" id="modal-description">Descrição do app</p>

                <div class="card bg-secondary bg-opacity-25 border-0 p-3 mt-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="text-muted">Condições comerciais:</span>
                        <span class="text-white fs-4 fw-bold" id="modal-price">A consultar</span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-2" id="modal-type-row">
                        <span class="text-muted">Tipo:</span>
                        <span id="modal-type-badge"></span>
                    </div>
                </div>
            </div>
            <div class="modal-footer border-secondary justify-content-center gap-2">
                <button type="button" class="btn btn-outline-light px-4" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-success px-4" onclick="confirmPurchase()">
                    <i class="bi bi-whatsapp"></i> Falar pelo WhatsApp
                </button>
            </div>
        </div>
    </div>
</div>

<style>
    .marketplace-card {
        background: linear-gradient(145deg, rgba(30, 30, 45, 0.9), rgba(20, 20, 35, 0.95)) !important;
        border: 1px solid rgba(255, 255, 255, 0.05) !important;
        border-radius: 16px !important;
        transition: all 0.3s ease;
    }

    .marketplace-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        border-color: rgba(255, 255, 255, 0.1) !important;
    }

    .app-icon {
        transition: transform 0.3s ease;
    }

    .marketplace-card:hover .app-icon {
        transform: scale(1.1);
    }

    .btn.active {
        background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
        border-color: transparent;
    }

    [data-filter] {
        transition: all 0.2s ease;
    }

    .app-card {
        transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .app-card.hidden {
        opacity: 0;
        transform: scale(0.95);
        pointer-events: none;
        position: absolute;
        visibility: hidden;
    }
</style>

<script>
    (function () {
        if (typeof window.trackEvent === 'function') {
            window.trackEvent('marketplace_view', { page: '/marketplace' });
        }

        const auth = window.authService;
        let currentPurchase = null;

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        function renderCatalogCard(item) {
            const isFree = item.type === 'free';

            const badge = isFree
                ? `<span class="badge bg-success bg-opacity-25 text-success border border-success border-opacity-25"><i class="bi bi-gift-fill"></i> Gratuito</span>`
                : `<span class="badge bg-primary bg-opacity-25 text-primary border border-primary border-opacity-25"><i class="bi bi-arrow-repeat"></i> ${item.type === 'subscription' ? 'Assinatura' : 'Compra Única'}</span>`;

            const priceBlock = isFree
                ? '<span class="text-success fs-5 fw-bold"><i class="bi bi-gift-fill"></i> Grátis</span>'
                : '<span class="text-white fs-4 fw-bold">A consultar</span>';

            const action = isFree
                ? `<a href="/apps?tool=${encodeURIComponent(item.appKey)}" class="btn btn-outline-success rounded-pill px-4">
                        <i class="bi bi-box-arrow-up-right"></i> Usar
                   </a>`
                : `<button class="btn btn-primary rounded-pill px-4"
                        onclick="openPurchaseModal('${escapeHtml(item.name).replace(/'/g, "\\'")}', '${item.type}')">
                        <i class="bi bi-chat-dots"></i> Consultar
                   </button>`;

            return `
                <div class="col-lg-4 col-md-6 app-card" data-type="${escapeHtml(item.type)}">
                    <div class="card bg-dark border-0 h-100 marketplace-card ${isFree ? 'free-card' : ''}">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div class="app-icon bg-primary bg-opacity-25 rounded-3 p-3">
                                    <i class="bi ${escapeHtml(item.icon || 'bi-box')} fs-2 text-primary"></i>
                                </div>
                                ${badge}
                            </div>
                            <h4 class="card-title text-white fw-bold mb-2">${escapeHtml(item.name)}</h4>
                            <p class="card-text text-muted small mb-3">${escapeHtml(item.description)}</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <div>${priceBlock}</div>
                                ${action}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function loadCatalog() {
            const grid = document.getElementById('apps-grid');
            try {
                const res = await window.core.fetchAPI('/catalog', 'GET');
                const items = (res && res.success && Array.isArray(res.data)) ? res.data : [];

                if (items.length === 0) {
                    grid.innerHTML = `
                        <div class="col-12 text-center py-5 text-muted">
                            <i class="bi bi-inbox fs-2 d-block mb-2"></i> Nenhum app disponível no momento.
                        </div>`;
                    return;
                }

                grid.innerHTML = items.map(renderCatalogCard).join('');
            } catch (e) {
                console.error('Failed to load catalog', e);
                grid.innerHTML = `
                    <div class="col-12 text-center py-5 text-muted">
                        <i class="bi bi-exclamation-triangle fs-2 d-block mb-2"></i> Não foi possível carregar o catálogo.
                    </div>`;
            }
        }

        loadCatalog();

        // Filter Apps
        window.filterApps = function (type, btn) {
            // Update active button
            document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Filter cards
            document.querySelectorAll('.app-card').forEach(card => {
                const cardType = card.dataset.type;
                if (type === 'all' || cardType === type) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        // Open Purchase Modal
        window.openPurchaseModal = function (name, type) {
            currentPurchase = { name, type };

            const modal = new bootstrap.Modal(document.getElementById('purchase-modal'));

            document.getElementById('modal-app-name').textContent = name;
            document.getElementById('modal-title').textContent = name;

            document.getElementById('modal-price').textContent = 'A consultar';

            const typeBadge = document.getElementById('modal-type-badge');
            if (type === 'subscription') {
                typeBadge.innerHTML = '<span class="badge bg-primary">Assinatura Mensal</span>';
                document.getElementById('modal-icon').innerHTML = '<i class="bi bi-arrow-repeat text-primary"></i>';
            } else {
                typeBadge.innerHTML = '<span class="badge bg-success">Compra Única</span>';
                document.getElementById('modal-icon').innerHTML = '<i class="bi bi-bag-check text-success"></i>';
            }

            modal.show();
        }

        // Confirm Purchase - Redirect to WhatsApp
        window.confirmPurchase = function () {
            if (!currentPurchase) return;

            const modalEl = document.getElementById('purchase-modal');
            const appName = currentPurchase.name;
            const phoneNumber = '5584988330532';
            const message = `Olá! Gostaria de receber informações sobre o produto: *${appName}*. Posso receber uma proposta?`;

            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;

            // Redirect
            window.open(whatsappUrl, '_blank');

            // Close modal
            const modalInstance = bootstrap.Modal.getInstance(modalEl);
            if (modalInstance) modalInstance.hide();

            if (window.core && window.core.toast) {
                window.core.toast('Redirecionando para o WhatsApp...', 'success');
            }
        }
    })();
</script>
