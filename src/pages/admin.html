<style>
    .cms-container {
        background: transparent;
        min-height: 100vh;
        font-family: 'Inter', sans-serif;
    }
    /* Tech UI Actions */
    .btn-action-tech {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #a1a1aa;
        transition: all 0.2s ease;
    }
    .btn-action-tech:hover {
        transform: translateY(-2px);
    }
    .btn-action-tech.edit:hover {
        background: rgba(59, 130, 246, 0.15);
        border-color: rgba(59, 130, 246, 0.4);
        color: #60a5fa;
    }
    .btn-action-tech.delete:hover {
        background: rgba(239, 68, 68, 0.15);
        border-color: rgba(239, 68, 68, 0.4);
        color: #f87171;
    }
    .extra-small {
        font-size: 0.75rem;
    }
    .hover-primary:hover {
        color: var(--ms-primary) !important;
    }
    .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    /* Rest of existing styles... */
    section.cms-container.dev-section {
        padding-top: 0.75rem;
        padding-bottom: 0.5rem;
        margin-top: 0.5rem;
        margin-bottom: 0;
    }
    .cms-panel {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
    }
    .cms-inner-panel {
        background: transparent !important;
        border: none !important;
        border-radius: 12px;
    }

    /* ===== Admin horizontal nav (Story 8.1) ===== */
    .admin-nav {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: wrap;
        padding: 6px;
        margin-bottom: 20px;
        background: #18181b;
        border: 1px solid #27272a;
        border-radius: 12px;
        position: relative;
    }
    .admin-nav-item,
    .admin-nav-dropdown-toggle {
        background: transparent;
        border: none;
        color: #a1a1aa; /* Zinc 400 */
        padding: 9px 16px;
        border-radius: 8px;
        font-weight: 500;
        font-size: 0.92rem;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.18s ease, color 0.18s ease;
        white-space: nowrap;
    }
    .admin-nav-item:hover,
    .admin-nav-dropdown-toggle:hover {
        background: #27272a;
        color: #fafafa;
    }
    .admin-nav-item.active,
    .admin-nav-dropdown-toggle.active {
        background: #fafafa; /* Zinc 50 */
        color: #09090b;
        font-weight: 600;
    }
    .admin-nav-item:focus-visible,
    .admin-nav-dropdown-toggle:focus-visible {
        outline: 2px solid #38bdf8;
        outline-offset: 2px;
    }
    .admin-nav-item i,
    .admin-nav-dropdown-toggle i {
        font-size: 1.05rem;
    }
    .admin-nav-group {
        position: relative;
    }
    .admin-nav-desktop {
        display: flex;
        align-items: center;
        gap: 4px;
    }
    .admin-nav-dropdown-toggle .admin-nav-caret {
        font-size: 0.65rem;
        opacity: 0.7;
        transition: transform 0.18s ease;
    }
    .admin-nav-group.show > .admin-nav-dropdown-toggle .admin-nav-caret {
        transform: rotate(180deg);
    }
    .admin-nav-menu {
        background: #1c1c21 !important;
        border: 1px solid #3f3f46 !important;
        border-radius: 10px !important;
        padding: 6px !important;
        margin-top: 6px !important;
        min-width: 12rem;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }
    .admin-nav-menu-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 9px 12px;
        border: none;
        border-radius: 7px;
        background: transparent;
        color: #d4d4d8;
        font-size: 0.9rem;
        font-weight: 500;
        text-align: left;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
    }
    .admin-nav-menu-item:hover {
        background: #27272a;
        color: #fafafa;
    }
    .admin-nav-menu-item.active {
        background: rgba(250, 250, 250, 0.12);
        color: #fafafa;
        font-weight: 600;
    }
    .admin-nav-hamburger {
        display: none;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 10px 14px;
        background: transparent;
        border: none;
        color: #fafafa;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        border-radius: 8px;
    }
    .admin-nav-hamburger:hover {
        background: #27272a;
    }
    .admin-nav-hamburger i {
        font-size: 1.3rem;
    }
    .admin-nav-hamburger .admin-nav-hamburger-label {
        color: #a1a1aa;
    }
    @media (max-width: 991.98px) {
        .admin-nav {
            flex-direction: column;
            align-items: stretch;
        }
        .admin-nav-hamburger {
            display: inline-flex;
        }
        .admin-nav-desktop {
            display: none;
        }
        .admin-nav.open .admin-nav-desktop {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 4px;
            padding-top: 8px;
            border-top: 1px solid #27272a;
        }
        .admin-nav.open .admin-nav-item,
        .admin-nav.open .admin-nav-dropdown-toggle {
            width: 100%;
            justify-content: flex-start;
        }
        .admin-nav-group .admin-nav-menu {
            position: static !important;
            transform: none !important;
            width: 100%;
            box-shadow: none;
            margin-top: 4px !important;
            background: #141418 !important;
        }
    }
    /* ===== Fim admin nav ===== */

    .cms-input {
        background: #18181b !important;
        border: 1px solid #3f3f46 !important; /* Zinc 700 */
        color: #fafafa !important;
        border-radius: 6px;
        padding: 10px 12px;
        transition: all 0.2s ease;
        font-size: 0.95rem;
    }
    .cms-input:focus {
        border-color: #fafafa !important;
        box-shadow: 0 0 0 2px rgba(250, 250, 250, 0.2) !important;
        outline: none;
    }
    .cms-input-color {
        height: 45px;
        padding: 4px;
        cursor: pointer;
    }
    .cms-alert {
        background: #18181b !important;
        border: 1px solid #27272a !important;
        color: #d4d4d8 !important; /* Zinc 300 */
        border-radius: 8px;
    }
    .cms-btn-primary {
        background: #fafafa !important;
        border: 1px solid #fafafa !important;
        color: #09090b !important;
        border-radius: 6px;
        padding: 10px 24px;
        font-weight: 500;
        transition: all 0.2s;
    }
    .cms-btn-primary:hover {
        background: #e4e4e7 !important; /* Zinc 200 */
        transform: translateY(-1px);
    }
    .cms-title {
        color: #fafafa;
        font-weight: 600;
        letter-spacing: -0.02em;
    }
    .note-editor.note-frame {
        border-radius: 10px !important;
        border: 1px solid #3f3f46 !important;
        overflow: hidden;
        background: #18181b !important;
    }
    .note-editor .note-toolbar,
    .note-editor .note-statusbar {
        background: #18181b !important;
        border-color: #27272a !important;
    }
    .note-editor .note-editing-area .note-editable {
        background: #0f0f12 !important;
        color: #fafafa !important;
        min-height: 500px;
    }
    .note-editor .note-placeholder {
        color: #52525b !important;
    }
    .note-editor .note-btn,
    .note-editor .note-color-all .note-dropdown-menu {
        background: #27272a !important;
        color: #fafafa !important;
        border-color: #3f3f46 !important;
    }
    .note-editor .note-btn:hover,
    .note-editor .note-btn.active {
        background: #3f3f46 !important;
        color: #fff !important;
        border-color: #52525b !important;
    }
    .note-editor .note-btn-group > .note-btn:hover {
        background: #3f3f46 !important;
    }
    /* Summernote dropdowns (style, fontname, color) */
    .note-editor .dropdown-menu,
    .note-editor .note-dropdown-menu {
        background: #1c1c21 !important;
        border: 1px solid #3f3f46 !important;
        color: #fafafa !important;
        box-shadow: 0 16px 40px rgba(0,0,0,0.6) !important;
    }
    .note-editor .dropdown-item,
    .note-editor .dropdown-style > li > a,
    .note-editor .dropdown-fontname > li > a {
        color: #d4d4d8 !important;
        background: transparent !important;
    }
    .note-editor .dropdown-item:hover,
    .note-editor .dropdown-style > li > a:hover,
    .note-editor .dropdown-fontname > li > a:hover {
        background: #27272a !important;
        color: #fafafa !important;
    }
    .note-editor .dropdown-item.active,
    .note-editor .dropdown-style > li > a.active,
    .note-editor .dropdown-fontname > li > a.active {
        background: #3f3f46 !important;
        color: #fff !important;
    }
    /* Summernote Modals (Insert Link, Image, etc) */
    .note-modal-content {
        background: #18181b !important;
        color: #fafafa !important;
        border: 1px solid #3f3f46 !important;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5) !important;
        border-radius: 12px !important;
    }
    .note-modal-header {
        border-bottom: 1px solid #27272a !important;
        padding: 15px 20px !important;
    }
    .note-modal-header .close {
        color: #fafafa !important;
        opacity: 0.5;
    }
    .note-modal-body {
        padding: 20px !important;
    }
    .note-modal-footer {
        border-top: 1px solid #27272a !important;
        padding: 15px 20px !important;
    }
    .note-form-label {
        color: #a1a1aa !important;
        margin-bottom: 8px !important;
        font-weight: 500 !important;
    }
    .note-input {
        background: #09090b !important;
        border: 1px solid #3f3f46 !important;
        color: #fafafa !important;
        border-radius: 6px !important;
        padding: 8px 12px !important;
    }
    .note-input:focus {
        border-color: #3b82f6 !important;
        outline: none !important;
    }
    .note-modal .btn-primary {
        background: #3b82f6 !important;
        border-color: #3b82f6 !important;
        color: #fff !important;
        font-weight: 600 !important;
    }
    .note-modal .btn-default {
        background: transparent !important;
        border-color: #3f3f46 !important;
        color: #fafafa !important;
    }
</style>

<section class="dev-section cms-container">
    <div class="container-fluid" style="max-width: 1200px;">
        <div class="card border-0 cms-panel">
            <div class="card-body px-4 px-md-5 pt-4 pt-md-5 pb-2 pb-md-3">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-3">
            <div>
                <h2 class="cms-title m-0 mb-1 fs-3">Conteúdo</h2>
                <p class="text-muted m-0 fs-6">Administração central</p>
            </div>
            <div>
                <span class="badge" style="background: rgba(250, 250, 250, 0.1); color: #fafafa; border: 1px solid rgba(250, 250, 250, 0.2); padding: 6px 12px; border-radius: 6px; font-weight: 400;">
                    <i class="bi bi-shield-check me-1"></i> Admin Master
                </span>
            </div>
        </div>

        <!-- Protected Content -->
        <div id="admin-content" style="display: none;">
            <!-- Horizontal Nav (Story 8.1) -->
            <nav class="admin-nav" aria-label="Navegacao do painel admin">
                <button type="button" class="admin-nav-hamburger" id="admin-nav-toggle" aria-expanded="false" aria-controls="admin-nav-desktop">
                    <i class="bi bi-list" aria-hidden="true"></i>
                    <span class="admin-nav-hamburger-label">Menu do painel</span>
                </button>

                <div class="admin-nav-desktop" id="admin-nav-desktop">
                    <button type="button" class="admin-nav-item active" data-tab="theme" onclick="loadTab('theme')">
                        <i class="bi bi-palette" aria-hidden="true"></i> Aparência
                    </button>

                    <div class="admin-nav-group dropdown" data-group="content">
                        <button type="button" class="admin-nav-dropdown-toggle dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-file-text" aria-hidden="true"></i> Conteúdo
                            <i class="bi bi-chevron-down admin-nav-caret" aria-hidden="true"></i>
                        </button>
                        <ul class="dropdown-menu admin-nav-menu">
                            <li><button type="button" class="admin-nav-menu-item" data-tab="mjson" onclick="loadTab('mjson')">
                                <i class="bi bi-braces" aria-hidden="true"></i> MJSON
                            </button></li>
                            <li><button type="button" class="admin-nav-menu-item" data-tab="blog" onclick="loadTab('blog')">
                                <i class="bi bi-journal-richtext" aria-hidden="true"></i> Módulo Blog
                            </button></li>
                        </ul>
                    </div>

                    <button type="button" class="admin-nav-item" data-tab="images" onclick="loadTab('images')">
                        <i class="bi bi-image" aria-hidden="true"></i> Mídia
                    </button>

                    <div class="admin-nav-group dropdown" data-group="system">
                        <button type="button" class="admin-nav-dropdown-toggle dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-gear" aria-hidden="true"></i> Sistema
                            <i class="bi bi-chevron-down admin-nav-caret" aria-hidden="true"></i>
                        </button>
                        <ul class="dropdown-menu admin-nav-menu">
                            <li><button type="button" class="admin-nav-menu-item" data-tab="logs" onclick="loadTab('logs')">
                                <i class="bi bi-activity" aria-hidden="true"></i> System Logs
                            </button></li>
                            <li><button type="button" class="admin-nav-menu-item" data-tab="users" onclick="loadTab('users')">
                                <i class="bi bi-person-plus" aria-hidden="true"></i> Usuários
                            </button></li>
                            <li><button type="button" class="admin-nav-menu-item" data-tab="apps" onclick="loadTab('apps')">

                            </button></li>

                    </div>
                </div>
            </nav>

            <!-- Main Area -->
            <div class="card border-0 cms-inner-panel">
                <div class="card-body p-0" id="tab-content">
                    <!-- Injeção via JS -->
                </div>
            </div>

        <!-- Access Denied -->
        <div id="access-denied" class="text-center py-5" style="display: none;">
            <i class="bi bi-shield-lock-fill text-danger mb-3" style="font-size: 4rem;"></i>
            <h3 class="text-white">Acesso Negado</h3>
            <p class="text-muted mx-auto mb-4" style="max-width: 400px;">Você precisa de privilégios de Administrador para acessar o Content Manager System.</p>
            <a href="/" class="btn cms-btn-primary">Retornar ao Início</a>

            </div>

<script>
    (function () {
        const auth = window.authService;
        const content = document.getElementById('admin-content');
        const denied = document.getElementById('access-denied');

        const CMS_LAST_TAB_KEY = 'msoft_cms_last_tab';
        const CMS_VALID_TABS = ['theme', 'mjson', 'images', 'blog', 'logs', 'users', 'apps'];
        /** Mapeia aba -> grupo do menu (Story 8.1). */
        const CMS_TAB_GROUP = { theme: null, mjson: 'content', blog: 'content', images: null, logs: 'system', users: 'system', apps: 'system' };

        // ===== Mobile nav toggle (Story 8.1) =====
        const adminNav = document.querySelector('.admin-nav');
        const adminNavToggle = document.getElementById('admin-nav-toggle');

        function closeAdminMobileNav() {
            if (adminNav) adminNav.classList.remove('open');
            if (adminNavToggle) adminNavToggle.setAttribute('aria-expanded', 'false');
        }

        if (adminNav && adminNavToggle) {
            adminNavToggle.addEventListener('click', () => {
                const isOpen = adminNav.classList.toggle('open');
                adminNavToggle.setAttribute('aria-expanded', String(isOpen));
            });

            document.addEventListener('pointerdown', (e) => {
                if (window.innerWidth < 992 && adminNav.classList.contains('open') && !adminNav.contains(e.target)) {
                    closeAdminMobileNav();
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && adminNav.classList.contains('open')) {
                    e.preventDefault();
                    closeAdminMobileNav();
                    adminNavToggle.focus({ preventScroll: true });
                }
            });
        }
        // ===== Fim mobile nav =====

        function updateAdminNavActiveState(tab) {
            // Itens de menu (diretos e de dropdown)
            document.querySelectorAll('.admin-nav [data-tab]').forEach(el => {
                el.classList.toggle('active', el.getAttribute('data-tab') === tab);
            });
            // Grupo pai (Conteúdo / Sistema)
            document.querySelectorAll('.admin-nav-group').forEach(group => {
                const toggle = group.querySelector('.admin-nav-dropdown-toggle');
                if (toggle) {
                    toggle.classList.toggle('active', group.getAttribute('data-group') === CMS_TAB_GROUP[tab]);
                }
            });
        }

        window.loadTab = async function (tab) {
            if (!CMS_VALID_TABS.includes(tab)) tab = 'theme';
            try {
                localStorage.setItem(CMS_LAST_TAB_KEY, tab);
            } catch (e) { /* ignore */ }

            updateAdminNavActiveState(tab);
            closeAdminMobileNav();

            const container = document.getElementById('tab-content');
            container.style.opacity = '0';
            
            setTimeout(async () => {
            if (tab === 'users') {
                container.innerHTML = `
                    <div class="d-flex flex-column flex-md-row align-items-md-start justify-content-between gap-3 mb-4">
                        <div>
                            <h4 class="mb-1 text-white fw-bold fs-3">Usuários por aplicação</h4>
                            <p class="text-secondary small mb-0">Contas comuns, permissões mínimas e sessões revogadas a cada alteração.</p>
                        </div>
                        <span class="badge align-self-md-center" style="background: rgba(56, 189, 248, 0.12); color: #bae6fd; border: 1px solid rgba(56, 189, 248, 0.3); padding: 7px 10px;">
                            <i class="bi bi-shield-lock me-1"></i> Escopo por aplicação
                        </span>
                    </div>
                    <div class="alert cms-alert mb-4">
                        <i class="bi bi-shield-check me-2 text-info"></i>
                        Este painel não exibe nem altera contas <strong>Admin Master</strong>. Desativar uma conta encerra suas sessões e remove todos os acessos; reativar não restaura permissões antigas.
                    </div>
                    <div class="row g-4">
                        <div class="col-lg-5">
                            <section class="border rounded-3 p-3 p-md-4 h-100" style="border-color: #27272a !important; background: rgba(24, 24, 27, 0.4);">
                                <div class="d-flex align-items-center gap-2 mb-1">
                                    <i class="bi bi-person-plus text-info"></i>
                                    <h5 class="text-white fw-semibold mb-0">Nova conta</h5>
                                </div>
                                <p class="text-secondary small mb-4">A conta nasce sem privilégios globais e recebe apenas o acesso selecionado.</p>
                                <form id="app-user-form" class="row g-3" novalidate>
                                    <div class="col-12">
                                        <label class="form-label text-light mb-2" for="app-user-name">Nome completo</label>
                                        <input id="app-user-name" type="text" class="form-control cms-input" autocomplete="name" maxlength="120" required>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label text-light mb-2" for="app-user-email">E-mail</label>
                                        <input id="app-user-email" type="email" class="form-control cms-input" autocomplete="email" maxlength="254" required>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label text-light mb-2" for="app-user-password">Senha inicial</label>
                                        <input id="app-user-password" type="password" class="form-control cms-input" autocomplete="new-password" minlength="12" maxlength="128" aria-describedby="app-user-password-help" required>
                                        <div id="app-user-password-help" class="form-text text-secondary small mt-2">Mínimo de 12 caracteres. A senha não volta a ser exibida pelo painel.</div>
                                    </div>
                                    <div class="col-md-7">
                                        <label class="form-label text-light mb-2" for="app-user-app-key">Aplicação</label>
                                        <input id="app-user-app-key" type="text" class="form-control cms-input" list="app-user-app-options" autocomplete="off" pattern="[a-z0-9][a-z0-9-]{0,63}" placeholder="Ex.: bva" required>
                                        <datalist id="app-user-app-options"></datalist>
                                    </div>
                                    <div class="col-md-5">
                                        <label class="form-label text-light mb-2" for="app-user-role">Permissão</label>
                                        <select id="app-user-role" class="form-select cms-input" required>
                                            <option value="viewer">Visualizador</option>
                                            <option value="editor">Editor</option>
                                            <option value="owner">Proprietário</option>
                                        </select>
                                    </div>
                                    <div class="col-12 d-flex flex-wrap align-items-center gap-3 mt-2">
                                        <button id="app-user-submit" type="submit" class="btn cms-btn-primary">
                                            <i class="bi bi-person-plus me-2"></i>Criar e conceder acesso
                                        </button>
                                        <div id="app-user-feedback" class="small" role="status" aria-live="polite" hidden></div>
                                    </div>
                                </form>
                            </section>
                        </div>
                        <div class="col-lg-7">
                            <section class="border rounded-3 p-3 p-md-4 h-100" style="border-color: #27272a !important; background: rgba(24, 24, 27, 0.4);">
                                <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-2 mb-3">
                                    <div>
                                        <h5 class="text-white fw-semibold mb-1">Contas gerenciáveis <span id="app-user-count" class="text-secondary small fw-normal"></span></h5>
                                        <p class="text-secondary small mb-0">Admin Masters não aparecem nesta lista.</p>
                                    </div>
                                    <button id="app-user-refresh" type="button" class="btn btn-sm btn-outline-light">
                                        <i class="bi bi-arrow-clockwise me-1"></i> Atualizar
                                    </button>
                                </div>
                                <form id="app-user-search-form" class="input-group mb-3" role="search">
                                    <label class="visually-hidden" for="app-user-search">Buscar usuário</label>
                                    <input id="app-user-search" type="search" class="form-control cms-input" maxlength="80" autocomplete="off" placeholder="Buscar por nome ou e-mail">
                                    <button type="submit" class="btn btn-outline-info">Buscar</button>
                                </form>
                                <div id="app-user-list" class="d-flex flex-column gap-2" aria-live="polite">
                                    <div class="text-center py-5 text-secondary"><span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Carregando usuários...</div>
                                </div>
                            </section>
                        </div>
                    </div>
                    <section id="app-user-editor-section" class="border rounded-3 p-3 p-md-4 mt-4" style="border-color: #27272a !important; background: rgba(24, 24, 27, 0.4);" hidden></section>
                `;

                const getUserElement = (id) => document.getElementById(id);
                const createForm = getUserElement('app-user-form');
                const nameInput = getUserElement('app-user-name');
                const emailInput = getUserElement('app-user-email');
                const passwordInput = getUserElement('app-user-password');
                const appKeyInput = getUserElement('app-user-app-key');
                const appRoleInput = getUserElement('app-user-role');
                const appOptions = getUserElement('app-user-app-options');
                const createButton = getUserElement('app-user-submit');
                const createFeedback = getUserElement('app-user-feedback');
                const searchForm = getUserElement('app-user-search-form');
                const searchInput = getUserElement('app-user-search');
                const refreshButton = getUserElement('app-user-refresh');
                const userList = getUserElement('app-user-list');
                const userCount = getUserElement('app-user-count');
                const editorSection = getUserElement('app-user-editor-section');
                let selectedUser = null;

                const escapeHtml = (value) => String(value ?? '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
                const encodeValue = (value) => encodeURIComponent(String(value ?? ''));
                const decodeValue = (value) => {
                    try { return decodeURIComponent(String(value || '')); } catch (_error) { return ''; }
                };
                const normalizeAppKey = (value) => String(value || '').trim().toLowerCase();
                const getErrorMessage = (error, fallback) => {
                    const message = String(error && error.message ? error.message : '').trim();
                    return message && !message.startsWith('API Error:') ? message : fallback;
                };
                const formatDate = (value, fallback = 'Nunca') => {
                    if (!value) return fallback;
                    const date = new Date(value);
                    return Number.isNaN(date.getTime()) ? fallback : date.toLocaleString('pt-BR');
                };
                const setFeedback = (element, message, type = 'error') => {
                    if (!element) return;
                    element.hidden = false;
                    element.className = type === 'success' ? 'small text-success' : type === 'info' ? 'small text-info' : 'small text-danger';
                    element.textContent = message;
                };
                const callUserApi = async (url, method = 'GET', payload = {}) => {
                    if (!window.core || typeof window.core.fetchAPI !== 'function') {
                        throw new Error('A comunicação com o servidor não está disponível.');
                    }
                    const response = await window.core.fetchAPI(url, method, payload, { silent: true });
                    if (!response || !response.success) {
                        const message = typeof (response && response.error) === 'string' ? response.error : 'A operação não foi concluída.';
                        throw new Error(message);
                    }
                    return response;
                };
                const setButtonBusy = (button, label) => {
                    if (!button) return () => {};
                    const originalContent = button.innerHTML;
                    button.disabled = true;
                    button.innerHTML = `<span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>${label}`;
                    return () => {
                        button.disabled = false;
                        button.innerHTML = originalContent;
                    };
                };

                const loadApplicationSuggestions = async () => {
                    if (!appOptions) return;
                    try {
                        const response = await callUserApi('/auth/admin/applications');
                        const fragment = document.createDocumentFragment();
                        const seen = new Set();
                        appOptions.replaceChildren();
                        (Array.isArray(response.data) ? response.data : []).forEach((item) => {
                            const appKey = normalizeAppKey(item && item.appKey);
                            if (!appKey || seen.has(appKey)) return;
                            seen.add(appKey);
                            const option = document.createElement('option');
                            option.value = appKey;
                            fragment.appendChild(option);
                        });
                        appOptions.appendChild(fragment);
                    } catch (_error) {
                        // Uma chave de aplicacao nova continua podendo ser informada manualmente.
                    }
                };

                // Catalogo real (GET /catalog, publico) usado para o select de "instalar app" —
                // diferente da lista de sugestoes de mAppAccess acima, aqui so entram appKeys
                // que realmente existem no catalogo, porque instalar exige o app cadastrado.
                let catalogAppsCache = [];

                const loadCatalogApps = async () => {
                    try {
                        const response = await window.core.fetchAPI('/catalog', 'GET');
                        catalogAppsCache = (response && response.success && Array.isArray(response.data)) ? response.data : [];
                    } catch (_error) {
                        catalogAppsCache = [];
                    }
                };

                const catalogAppOptions = (installedKeys) => {
                    const installed = new Set(installedKeys);
                    const available = catalogAppsCache.filter((item) => !installed.has(normalizeAppKey(item.appKey)));
                    if (!available.length) {
                        return '<option value="">Nenhum app disponível no catálogo</option>';
                    }
                    return '<option value="">Selecione um app...</option>' + available
                        .map((item) => `<option value="${encodeValue(normalizeAppKey(item.appKey))}">${escapeHtml(item.name)} (${escapeHtml(item.appKey)})</option>`)
                        .join('');
                };

                const renderUserList = (users) => {
                    if (!userList) return;
                    if (userCount) userCount.textContent = `(${users.length})`;
                    if (!users.length) {
                        userList.innerHTML = '<div class="text-center text-secondary border rounded-3 py-4 px-3" style="border-color: #27272a !important;">Nenhuma conta encontrada.</div>';
                        return;
                    }

                    userList.innerHTML = users.map((user) => {
                        const active = user.status === 'active';
                        const accesses = Array.isArray(user.appAccesses) ? user.appAccesses : [];
                        const status = active
                            ? '<span class="badge text-bg-success-subtle text-success-emphasis">Ativo</span>'
                            : '<span class="badge text-bg-secondary">Inativo</span>';
                        const accessLabel = accesses.length === 1 ? '1 aplicação' : `${accesses.length} aplicações`;
                        return `
                            <article class="border rounded-3 p-3" style="border-color: #3f3f46 !important; background: rgba(9, 9, 11, 0.28);">
                                <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3">
                                    <div class="min-w-0">
                                        <div class="d-flex flex-wrap align-items-center gap-2 mb-1">
                                            <h6 class="text-white mb-0 text-truncate">${escapeHtml(user.name || 'Sem nome')}</h6>
                                            ${status}
                                        </div>
                                        <div class="small text-secondary text-truncate">${escapeHtml(user.email || '')}</div>
                                        <div class="small text-secondary mt-2"><i class="bi bi-grid me-1"></i>${accessLabel} <span class="opacity-50 mx-1">|</span> criado em ${escapeHtml(formatDate(user.createdAt, 'data indisponível'))}</div>
                                    </div>
                                    <button type="button" class="btn btn-sm btn-outline-light align-self-sm-center" data-user-action="edit" data-user-id="${encodeValue(user.id)}">
                                        <i class="bi bi-sliders me-1"></i> Gerenciar
                                    </button>
                                </div>
                            </article>
                        `;
                    }).join('');
                };

                const refreshUsers = async () => {
                    if (!userList) return;
                    userList.innerHTML = '<div class="text-center py-4 text-secondary"><span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Atualizando usuários...</div>';
                    const query = String(searchInput && searchInput.value ? searchInput.value : '').trim();
                    const url = `/auth/admin/users?limit=50${query ? `&q=${encodeURIComponent(query)}` : ''}`;
                    try {
                        const response = await callUserApi(url);
                        if (!container.contains(userList)) return;
                        renderUserList(Array.isArray(response.data) ? response.data : []);
                    } catch (error) {
                        if (userCount) userCount.textContent = '';
                        if (container.contains(userList)) {
                            userList.innerHTML = `<div class="text-danger border rounded-3 py-4 px-3" style="border-color: rgba(239, 68, 68, 0.35) !important;">${escapeHtml(getErrorMessage(error, 'Não foi possível carregar os usuários.'))}</div>`;
                        }
                    }
                };

                const roleOptions = (selectedRole) => ['viewer', 'editor', 'owner'].map((role) => {
                    const labels = { viewer: 'Visualizador', editor: 'Editor', owner: 'Proprietário' };
                    return `<option value="${role}"${role === selectedRole ? ' selected' : ''}>${labels[role]}</option>`;
                }).join('');

                const renderEditor = (user, feedbackMessage = '', feedbackType = 'success') => {
                    if (!editorSection) return;
                    selectedUser = user;
                    const active = user.status === 'active';
                    const accesses = Array.isArray(user.appAccesses) ? user.appAccesses : [];
                    const accessesHtml = accesses.length
                        ? accesses.map((access) => `
                            <div class="border rounded-3 p-3" data-app-access data-app-key="${encodeValue(access.appKey)}" style="border-color: #3f3f46 !important; background: rgba(9, 9, 11, 0.28);">
                                <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
                                    <div>
                                        <div class="text-white fw-semibold">${escapeHtml(access.appKey)}</div>
                                        <div class="small text-secondary">Concedido em ${escapeHtml(formatDate(access.createdAt, 'data indisponível'))}</div>
                                    </div>
                                    <div class="d-flex flex-wrap align-items-center gap-2">
                                        <select class="form-select form-select-sm cms-input" aria-label="Permissão para ${escapeHtml(access.appKey)}" style="min-width: 150px;">${roleOptions(access.role)}</select>
                                        <button type="button" class="btn btn-sm btn-outline-info" data-access-action="save"><i class="bi bi-check2 me-1"></i>Salvar</button>
                                        <button type="button" class="btn btn-sm btn-outline-danger" data-access-action="revoke"><i class="bi bi-x-lg me-1"></i>Revogar</button>
                                    </div>
                                </div>
                            </div>
                        `).join('')
                        : '<div class="text-secondary small border rounded-3 p-3" style="border-color: #3f3f46 !important;">Nenhuma permissão de aplicação foi concedida.</div>';
                    const statusBadge = active
                        ? '<span class="badge text-bg-success-subtle text-success-emphasis">Ativo</span>'
                        : '<span class="badge text-bg-secondary">Inativo</span>';

                    const installedApps = Array.isArray(user.installedApps) ? user.installedApps : [];
                    const installedKeys = installedApps.map((app) => normalizeAppKey(app.appKey));
                    const installedAppsHtml = installedApps.length
                        ? installedApps.map((app) => `
                            <div class="border rounded-3 p-3" data-installed-app data-app-key="${encodeValue(app.appKey)}" style="border-color: #3f3f46 !important; background: rgba(9, 9, 11, 0.28);">
                                <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
                                    <div>
                                        <div class="text-white fw-semibold">${escapeHtml(app.name || app.appKey)}</div>
                                        <div class="small text-secondary">${escapeHtml(app.appKey)} <span class="opacity-50 mx-1">|</span> instalado em ${escapeHtml(formatDate(app.createdAt, 'data indisponível'))}</div>
                                    </div>
                                    <button type="button" class="btn btn-sm btn-outline-danger" data-installed-app-action="remove"><i class="bi bi-trash me-1"></i>Remover</button>
                                </div>
                            </div>
                        `).join('')
                        : '<div class="text-secondary small border rounded-3 p-3" style="border-color: #3f3f46 !important;">Nenhum app instalado nesta conta.</div>';

                    editorSection.hidden = false;
                    editorSection.innerHTML = `
                        <div class="d-flex flex-column flex-md-row align-items-md-start justify-content-between gap-3 mb-4">
                            <div>
                                <div class="d-flex flex-wrap align-items-center gap-2 mb-1">
                                    <h5 class="text-white fw-semibold mb-0">Gerenciar ${escapeHtml(user.name || 'usuário')}</h5>
                                    ${statusBadge}
                                </div>
                                <p class="text-secondary small mb-0">${escapeHtml(user.email || '')} <span class="opacity-50 mx-1">|</span> último acesso: ${escapeHtml(formatDate(user.lastLogin))}</p>
                            </div>
                            <button id="app-user-editor-close" type="button" class="btn btn-sm btn-outline-light"><i class="bi bi-x-lg me-1"></i>Fechar</button>
                        </div>
                        <div id="app-user-editor-feedback" class="small mb-3" role="status" aria-live="polite" hidden></div>
                        <form id="app-user-editor-form" class="row g-3" novalidate>
                            <div class="col-md-6">
                                <label class="form-label text-light mb-2" for="app-user-edit-name">Nome completo</label>
                                <input id="app-user-edit-name" type="text" class="form-control cms-input" maxlength="120" autocomplete="name" value="${escapeHtml(user.name || '')}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-light mb-2" for="app-user-edit-email">E-mail</label>
                                <input id="app-user-edit-email" type="email" class="form-control cms-input" maxlength="254" autocomplete="email" value="${escapeHtml(user.email || '')}" required>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label text-light mb-2" for="app-user-edit-password">Nova senha <span class="text-secondary fw-normal">(opcional)</span></label>
                                <input id="app-user-edit-password" type="password" class="form-control cms-input" minlength="12" maxlength="128" autocomplete="new-password" aria-describedby="app-user-edit-password-help">
                                <div id="app-user-edit-password-help" class="form-text text-secondary small mt-2">Preencha somente para trocar a senha. Qualquer atualização encerra as sessões existentes.</div>
                            </div>
                            <div class="col-md-4 d-flex align-items-end">
                                <button id="app-user-edit-submit" type="submit" class="btn cms-btn-primary w-100"><i class="bi bi-save me-2"></i>Salvar perfil</button>
                            </div>
                        </form>
                        <hr class="border-secondary opacity-25 my-4">
                        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2 mb-3">
                            <div>
                                <h6 class="text-white fw-semibold mb-1">Apps instalados</h6>
                                <p class="text-secondary small mb-0">Controla o que aparece em "Meus Aplicativos" no painel do usuário. Independente das permissões abaixo.</p>
                            </div>
                        </div>
                        ${active ? `
                            <form id="app-user-install-form" class="row g-3 mb-3" novalidate>
                                <div class="col-md-8">
                                    <label class="form-label text-light mb-2" for="app-user-install-key">App do catálogo</label>
                                    <select id="app-user-install-key" class="form-select cms-input" required>${catalogAppOptions(installedKeys)}</select>
                                </div>
                                <div class="col-md-4 d-flex align-items-end">
                                    <button id="app-user-install-submit" type="submit" class="btn btn-outline-info w-100"><i class="bi bi-plus-lg me-1"></i>Instalar</button>
                                </div>
                            </form>
                        ` : `
                            <div class="alert cms-alert small mb-3"><i class="bi bi-lock me-2 text-warning"></i>Reative a conta antes de instalar novos apps.</div>
                        `}
                        <div id="app-user-installed-list" class="d-flex flex-column gap-2">${installedAppsHtml}</div>
                        <hr class="border-secondary opacity-25 my-4">
                        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2 mb-3">
                            <div>
                                <h6 class="text-white fw-semibold mb-1">Permissões por aplicação</h6>
                                <p class="text-secondary small mb-0">Apenas estas permissões determinam o acesso aos produtos.</p>
                            </div>
                        </div>
                        ${active ? `
                            <form id="app-user-access-form" class="row g-3 mb-3" novalidate>
                                <div class="col-md-6">
                                    <label class="form-label text-light mb-2" for="app-user-access-key">Aplicação</label>
                                    <input id="app-user-access-key" type="text" class="form-control cms-input" list="app-user-app-options" autocomplete="off" pattern="[a-z0-9][a-z0-9-]{0,63}" placeholder="Ex.: bva" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label text-light mb-2" for="app-user-access-role">Permissão</label>
                                    <select id="app-user-access-role" class="form-select cms-input">${roleOptions('viewer')}</select>
                                </div>
                                <div class="col-md-3 d-flex align-items-end">
                                    <button id="app-user-access-submit" type="submit" class="btn btn-outline-info w-100"><i class="bi bi-plus-lg me-1"></i>Conceder</button>
                                </div>
                            </form>
                        ` : `
                            <div class="alert cms-alert small mb-3"><i class="bi bi-lock me-2 text-warning"></i>Reative a conta antes de conceder permissões. Nenhum acesso anterior será restaurado.</div>
                        `}
                        <div id="app-user-access-list" class="d-flex flex-column gap-2">${accessesHtml}</div>
                        <hr class="border-secondary opacity-25 my-4">
                        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">
                            <p class="text-secondary small mb-0">A exclusão é lógica para preservar auditoria e impedir reutilização indevida da conta.</p>
                            ${active
                                ? '<button id="app-user-deactivate" type="button" class="btn btn-outline-danger"><i class="bi bi-person-x me-2"></i>Desativar e revogar acessos</button>'
                                : '<button id="app-user-reactivate" type="button" class="btn btn-outline-info"><i class="bi bi-person-check me-2"></i>Reativar sem acessos</button>'}
                        </div>
                    `;

                    const editorFeedback = getUserElement('app-user-editor-feedback');
                    if (feedbackMessage) setFeedback(editorFeedback, feedbackMessage, feedbackType);
                    bindEditorEvents();
                };

                const loadManagedUser = async (userId, feedbackMessage = '', feedbackType = 'success') => {
                    if (!editorSection || !userId) return;
                    editorSection.hidden = false;
                    editorSection.innerHTML = '<div class="text-center py-4 text-secondary"><span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Carregando dados do usuário...</div>';
                    try {
                        const [userResponse, appsResponse] = await Promise.all([
                            callUserApi(`/auth/admin/users/${encodeURIComponent(userId)}`),
                            callUserApi(`/auth/admin/users/${encodeURIComponent(userId)}/apps`).catch(() => ({ data: [] })),
                            catalogAppsCache.length ? Promise.resolve() : loadCatalogApps(),
                        ]);
                        if (!container.contains(editorSection)) return;
                        const user = { ...userResponse.user, installedApps: Array.isArray(appsResponse.data) ? appsResponse.data : [] };
                        renderEditor(user, feedbackMessage, feedbackType);
                    } catch (error) {
                        if (container.contains(editorSection)) {
                            editorSection.innerHTML = `<div class="text-danger">${escapeHtml(getErrorMessage(error, 'Não foi possível carregar este usuário.'))}</div>`;
                        }
                    }
                };

                const bindEditorEvents = () => {
                    const closeButton = getUserElement('app-user-editor-close');
                    const profileForm = getUserElement('app-user-editor-form');
                    const profileName = getUserElement('app-user-edit-name');
                    const profileEmail = getUserElement('app-user-edit-email');
                    const profilePassword = getUserElement('app-user-edit-password');
                    const profileButton = getUserElement('app-user-edit-submit');
                    const editorFeedback = getUserElement('app-user-editor-feedback');
                    const accessForm = getUserElement('app-user-access-form');
                    const accessKey = getUserElement('app-user-access-key');
                    const accessRole = getUserElement('app-user-access-role');
                    const accessButton = getUserElement('app-user-access-submit');
                    const accessList = getUserElement('app-user-access-list');
                    const installForm = getUserElement('app-user-install-form');
                    const installKey = getUserElement('app-user-install-key');
                    const installButton = getUserElement('app-user-install-submit');
                    const installedList = getUserElement('app-user-installed-list');
                    const deactivateButton = getUserElement('app-user-deactivate');
                    const reactivateButton = getUserElement('app-user-reactivate');

                    if (closeButton) {
                        closeButton.addEventListener('click', () => {
                            selectedUser = null;
                            editorSection.hidden = true;
                            editorSection.replaceChildren();
                        });
                    }

                    if (profileForm && profileName && profileEmail && profilePassword && profileButton) {
                        profileForm.addEventListener('submit', async (event) => {
                            event.preventDefault();
                            if (!selectedUser) return;
                            if (!profileForm.checkValidity()) {
                                profileForm.reportValidity();
                                return;
                            }
                            const name = profileName.value.trim();
                            const email = profileEmail.value.trim();
                            const password = profilePassword.value;
                            if (name === selectedUser.name && email.toLowerCase() === String(selectedUser.email || '').toLowerCase() && !password) {
                                setFeedback(editorFeedback, 'Nenhuma alteração de perfil foi informada.', 'info');
                                return;
                            }
                            const restoreButton = setButtonBusy(profileButton, 'Salvando...');
                            try {
                                const payload = { name, email };
                                if (password) payload.password = password;
                                const response = await callUserApi(`/auth/admin/users/${encodeURIComponent(selectedUser.id)}`, 'PUT', payload);
                                await refreshUsers();
                                renderEditor(response.user, 'Perfil atualizado e sessões anteriores invalidadas.', 'success');
                            } catch (error) {
                                setFeedback(editorFeedback, getErrorMessage(error, 'Não foi possível atualizar o usuário.'), 'error');
                            } finally {
                                restoreButton();
                            }
                        });
                    }

                    if (accessKey) {
                        accessKey.addEventListener('change', () => {
                            accessKey.value = normalizeAppKey(accessKey.value);
                        });
                    }

                    if (accessForm && accessKey && accessRole && accessButton) {
                        accessForm.addEventListener('submit', async (event) => {
                            event.preventDefault();
                            if (!selectedUser) return;
                            accessKey.value = normalizeAppKey(accessKey.value);
                            if (!accessForm.checkValidity()) {
                                accessForm.reportValidity();
                                return;
                            }
                            const restoreButton = setButtonBusy(accessButton, 'Concedendo...');
                            try {
                                await callUserApi(`/auth/admin/users/${encodeURIComponent(selectedUser.id)}/access/${encodeURIComponent(accessKey.value)}`, 'PUT', { role: accessRole.value });
                                await loadManagedUser(selectedUser.id, 'Permissão atualizada.', 'success');
                                await loadApplicationSuggestions();
                                await refreshUsers();
                            } catch (error) {
                                setFeedback(editorFeedback, getErrorMessage(error, 'Não foi possível conceder o acesso.'), 'error');
                            } finally {
                                restoreButton();
                            }
                        });
                    }

                    if (accessList) {
                        accessList.addEventListener('click', async (event) => {
                            const button = event.target.closest('button[data-access-action]');
                            const accessRow = button && button.closest('[data-app-access]');
                            if (!button || !accessRow || !selectedUser) return;
                            const appKey = decodeValue(accessRow.dataset.appKey);
                            if (!appKey) return;
                            const action = button.dataset.accessAction;
                            const select = accessRow.querySelector('select');
                            if (action === 'revoke' && !window.confirm(`Revogar o acesso de ${selectedUser.email} à aplicação ${appKey}?`)) return;
                            const restoreButton = setButtonBusy(button, action === 'revoke' ? 'Revogando...' : 'Salvando...');
                            try {
                                if (action === 'revoke') {
                                    await callUserApi(`/auth/admin/users/${encodeURIComponent(selectedUser.id)}/access/${encodeURIComponent(appKey)}`, 'DELETE');
                                } else {
                                    await callUserApi(`/auth/admin/users/${encodeURIComponent(selectedUser.id)}/access/${encodeURIComponent(appKey)}`, 'PUT', { role: select ? select.value : 'viewer' });
                                }
                                await loadManagedUser(selectedUser.id, action === 'revoke' ? 'Acesso revogado.' : 'Permissão atualizada.', 'success');
                                await loadApplicationSuggestions();
                                await refreshUsers();
                            } catch (error) {
                                setFeedback(editorFeedback, getErrorMessage(error, 'Não foi possível atualizar o acesso.'), 'error');
                            } finally {
                                restoreButton();
                            }
                        });
                    }

                    if (installForm && installKey && installButton) {
                        installForm.addEventListener('submit', async (event) => {
                            event.preventDefault();
                            if (!selectedUser) return;
                            if (!installKey.value) {
                                setFeedback(editorFeedback, 'Selecione um app do catálogo para instalar.', 'error');
                                return;
                            }
                            const restoreButton = setButtonBusy(installButton, 'Instalando...');
                            try {
                                await callUserApi(`/auth/admin/users/${encodeURIComponent(selectedUser.id)}/apps/${encodeURIComponent(installKey.value)}`, 'PUT');

                                setFeedback(editorFeedback, getErrorMessage(error, 'Não foi possível instalar o app.'), 'error');

                                restoreButton();

                    if (installedList) {

                            const appKey = decodeValue(appRow.dataset.appKey);

                            if (!window.confirm(`Remover o app ${appKey} da conta de ${selectedUser.email}?`)) return;
                            const restoreButton = setButtonBusy(button, 'Removendo...');
                            try {
                                await callUserApi(`/auth/admin/users/${encodeURIComponent(selectedUser.id)}/apps/${encodeURIComponent(appKey)}`, 'DELETE');
                                await loadManagedUser(selectedUser.id, 'App removido.', 'success');
                                await refreshUsers();
                            } catch (error) {
                                setFeedback(editorFeedback, getErrorMessage(error, 'Não foi possível remover o app.'), 'error');
                            } finally {
                                restoreButton();
                            }
                        });
                    }

                    if (deactivateButton) {
                        deactivateButton.addEventListener('click', async () => {
                            if (!selectedUser || !window.confirm(`Desativar ${selectedUser.email} e revogar todos os acessos às aplicações?`)) return;
                            const restoreButton = setButtonBusy(deactivateButton, 'Desativando...');
                            try {
                                await callUserApi(`/auth/admin/users/${encodeURIComponent(selectedUser.id)}`, 'DELETE');

                                editorSection.hidden = true;
                                editorSection.replaceChildren();
                                await refreshUsers();
                                await loadApplicationSuggestions();
                            } catch (error) {
                                setFeedback(editorFeedback, getErrorMessage(error, 'Não foi possível desativar o usuário.'), 'error');
                            } finally {
                                restoreButton();
                            }
                        });
                    }

                    if (reactivateButton) {
                        reactivateButton.addEventListener('click', async () => {
                            if (!selectedUser || !window.confirm(`Reativar ${selectedUser.email} sem restaurar nenhuma permissão anterior?`)) return;
                            const restoreButton = setButtonBusy(reactivateButton, 'Reativando...');
                            try {
                                await callUserApi(`/auth/admin/users/${encodeURIComponent(selectedUser.id)}/reactivate`, 'POST');
                                await loadManagedUser(selectedUser.id, 'Usuário reativado sem acessos. Conceda somente as permissões necessárias.', 'success');
                                await refreshUsers();
                                await loadApplicationSuggestions();
                            } catch (error) {
                                setFeedback(editorFeedback, getErrorMessage(error, 'Não foi possível reativar o usuário.'), 'error');
                            } finally {
                                restoreButton();
                            }
                        });
                    }
                };

                if (appKeyInput) {
                    appKeyInput.addEventListener('change', () => {
                        appKeyInput.value = normalizeAppKey(appKeyInput.value);

                if (createForm && nameInput && emailInput && passwordInput && appKeyInput && appRoleInput && createButton) {
                    createForm.addEventListener('submit', async (event) => {

                            createForm.reportValidity();

                        }
                        const restoreButton = setButtonBusy(createButton, 'Criando...');

                            await callUserApi('/auth/admin/users', 'POST', {

                                email: emailInput.value.trim(),
                                password: passwordInput.value,
                                appKey: appKeyInput.value,
                                appRole: appRoleInput.value,

                            createForm.reset();

                            await loadApplicationSuggestions();
                            await refreshUsers();

                            setFeedback(createFeedback, getErrorMessage(error, 'Não foi possível criar o usuário.'), 'error');

                            restoreButton();
                        }
                    });

                        const button = event.target.closest('button[data-user-action="edit"]');

                                            <i class="bi bi-plus-lg me-2"></i>Cadastrar app

                                    </div>
                                </form>
                            </section>
                        </div>
                        <div class="col-lg-7">
                            <section class="border rounded-3 p-3 p-md-4 h-100" style="border-color: #27272a !important; background: rgba(24, 24, 27, 0.4);">
                                <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-2 mb-3">
                                    <div>
                                        <h5 class="text-white fw-semibold mb-1">Apps cadastrados <span id="catalog-app-count" class="text-secondary small fw-normal"></span></h5>
                                        <p class="text-secondary small mb-0">Inclui apps inativos, ocultos do marketplace.</p>

                                </div>
                            </section>
                        </div>
                    </div>

                const getCatalogElement = (id) => document.getElementById(id);

                const appKeyInput = getCatalogElement('catalog-app-key');
                const categoryInput = getCatalogElement('catalog-app-category');
                const descriptionInput = getCatalogElement('catalog-app-description');
                const typeInput = getCatalogElement('catalog-app-type');
                const priceInput = getCatalogElement('catalog-app-price');
                const currencyInput = getCatalogElement('catalog-app-currency');
                const iconInput = getCatalogElement('catalog-app-icon');
                const featuresInput = getCatalogElement('catalog-app-features');
                const submitButton = getCatalogElement('catalog-app-submit');
                const cancelButton = getCatalogElement('catalog-app-cancel');

                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');

                    try { return decodeURIComponent(String(value || '')); } catch (_error) { return ''; }

                const getErrorMessage = (error, fallback) => {
                    const message = String(error && error.message ? error.message : '').trim();
                    return message && !message.startsWith('API Error:') ? message : fallback;
                };
                const setFeedback = (element, message, type = 'error') => {
                    if (!element) return;
                    element.hidden = false;
                    element.className = type === 'success' ? 'small text-success' : type === 'info' ? 'small text-info' : 'small text-danger';
                    element.textContent = message;
                };
                const callCatalogApi = async (url, method = 'GET', payload = {}) => {
                    if (!window.core || typeof window.core.fetchAPI !== 'function') {
                        throw new Error('A comunicação com o servidor não está disponível.');
                    }
                    const response = await window.core.fetchAPI(url, method, payload, { silent: true });
                    if (!response || !response.success) {
                        const message = typeof (response && response.error) === 'string' ? response.error : 'A operação não foi concluída.';
                        throw new Error(message);
                    }
                    return response;
                };
                const setButtonBusy = (button, label) => {
                    if (!button) return () => {};
                    const originalContent = button.innerHTML;
                    button.disabled = true;
                    button.innerHTML = `<span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>${label}`;
                    return () => {
                        button.disabled = false;
                        button.innerHTML = originalContent;
                    };
                };
                const CATALOG_TYPE_LABELS = { free: 'Grátis', subscription: 'Assinatura', 'one-time': 'Pagamento único' };
                const formatPrice = (item) => {
                    const price = Number(item && item.price);
                    if (!Number.isFinite(price) || price <= 0) return 'Grátis';
                    try {
                        return price.toLocaleString('pt-BR', { style: 'currency', currency: String(item.currency || 'BRL') });
                    } catch (_error) {
                        return `R$ ${price.toFixed(2)}`;
                    }
                };
                const parseFeatures = (value) => String(value || '')
                    .split('\n')
                    .map((line) => line.trim())
                    .filter(Boolean);

                const resetCatalogForm = () => {
                    editingAppKey = null;
                    if (catalogForm) catalogForm.reset();
                    if (appKeyInput) appKeyInput.disabled = false;
                    if (priceInput) priceInput.value = '0';
                    if (currencyInput) currencyInput.value = 'BRL';
                    if (formTitle) formTitle.textContent = 'Novo app';
                    if (formSubtitle) formSubtitle.textContent = 'Cadastre um app para disponibilizá-lo no marketplace.';
                    if (submitButton) submitButton.innerHTML = '<i class="bi bi-plus-lg me-2"></i>Cadastrar app';
                    if (cancelButton) cancelButton.hidden = true;
                };

                const startEditing = (item) => {
                    if (!item) return;
                    editingAppKey = normalizeAppKey(item.appKey);
                    if (nameInput) nameInput.value = item.name || '';
                    if (appKeyInput) {
                        appKeyInput.value = editingAppKey;
                        appKeyInput.disabled = true;
                    }
                    if (categoryInput) categoryInput.value = item.category || '';
                    if (descriptionInput) descriptionInput.value = item.description || '';
                    if (typeInput) typeInput.value = item.type || 'free';
                    if (priceInput) priceInput.value = String(Number(item.price) || 0);
                    if (currencyInput) currencyInput.value = item.currency || 'BRL';
                    if (iconInput) iconInput.value = item.icon || '';
                    if (featuresInput) featuresInput.value = (Array.isArray(item.features) ? item.features : []).join('\n');
                    if (formTitle) formTitle.textContent = `Editando: ${item.name || editingAppKey}`;
                    if (formSubtitle) formSubtitle.textContent = 'A chave (appKey) não pode ser alterada após o cadastro.';
                    if (submitButton) submitButton.innerHTML = '<i class="bi bi-check-lg me-2"></i>Salvar alterações';
                    if (cancelButton) cancelButton.hidden = false;
                    if (formFeedback) formFeedback.hidden = true;
                    if (nameInput) nameInput.focus();
                };

                let catalogItemsCache = [];

                const renderCatalogList = (items) => {
                    if (!catalogList) return;
                    if (catalogCount) catalogCount.textContent = `(${items.length})`;
                    if (!items.length) {
                        catalogList.innerHTML = '<div class="text-center text-secondary border rounded-3 py-4 px-3" style="border-color: #27272a !important;">Nenhum app cadastrado no catálogo.</div>';
                        return;
                    }
                    catalogList.innerHTML = items.map((item) => {
                        const active = item.active !== false;
                        const status = active
                            ? '<span class="badge text-bg-success-subtle text-success-emphasis">Ativo</span>'
                            : '<span class="badge text-bg-secondary">Inativo</span>';
                        const typeLabel = CATALOG_TYPE_LABELS[item.type] || item.type || 'Grátis';
                        const toggleButton = active
                            ? `<button type="button" class="btn btn-sm btn-outline-danger" data-catalog-action="deactivate" data-app-key="${encodeValue(item.appKey)}"><i class="bi bi-eye-slash me-1"></i> Desativar</button>`
                            : `<button type="button" class="btn btn-sm btn-outline-success" data-catalog-action="reactivate" data-app-key="${encodeValue(item.appKey)}"><i class="bi bi-eye me-1"></i> Reativar</button>`;
                        return `
                            <article class="border rounded-3 p-3" style="border-color: #3f3f46 !important; background: rgba(9, 9, 11, 0.28);">

                                    <div class="min-w-0">
                                        <div class="d-flex flex-wrap align-items-center gap-2 mb-1">
                                            <i class="bi ${escapeHtml(item.icon || 'bi-box')} text-info"></i>
                                            <h6 class="text-white mb-0 text-truncate">${escapeHtml(item.name || 'Sem nome')}</h6>
                                            ${status}

                                        </div>
                                        <div class="small text-secondary text-truncate">${escapeHtml(item.description || '')}</div>
                                        <div class="small text-secondary mt-2">
                                            <i class="bi bi-key me-1"></i>${escapeHtml(item.appKey || '')}
                                            <span class="opacity-50 mx-1">|</span> ${escapeHtml(formatPrice(item))}
                                            ${item.category ? `<span class="opacity-50 mx-1">|</span> <i class="bi bi-tag me-1"></i>${escapeHtml(item.category)}` : ''}
                                        </div>
                                    </div>
                                    <div class="d-flex flex-sm-column gap-2 align-self-sm-center">
                                        <button type="button" class="btn btn-sm btn-outline-light" data-catalog-action="edit" data-app-key="${encodeValue(item.appKey)}">
                                            <i class="bi bi-pencil me-1"></i> Editar
                                        </button>
                                        ${toggleButton}
                                    </div>
                                </div>
                            </article>
                        `;
                    }).join('');
                };

                const refreshCatalog = async () => {
                    if (!catalogList) return;
                    catalogList.innerHTML = '<div class="text-center py-4 text-secondary"><span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Atualizando apps...</div>';
                    try {
                        const response = await callCatalogApi('/catalog/admin');
                        if (!container.contains(catalogList)) return;
                        catalogItemsCache = Array.isArray(response.data) ? response.data : [];
                        renderCatalogList(catalogItemsCache);
                    } catch (error) {
                        if (catalogCount) catalogCount.textContent = '';
                        if (container.contains(catalogList)) {
                            catalogList.innerHTML = `<div class="text-danger border rounded-3 py-4 px-3" style="border-color: rgba(239, 68, 68, 0.35) !important;">${escapeHtml(getErrorMessage(error, 'Não foi possível carregar o catálogo.'))}</div>`;
                        }
                    }
                };

                if (appKeyInput) {
                    appKeyInput.addEventListener('change', () => {
                        appKeyInput.value = normalizeAppKey(appKeyInput.value);
                    });
                }

                if (catalogForm && submitButton) {
                    catalogForm.addEventListener('submit', async (event) => {
                        event.preventDefault();
                        appKeyInput.value = normalizeAppKey(appKeyInput.value);
                        if (!catalogForm.checkValidity()) {
                            catalogForm.reportValidity();
                            return;
                        }
                        const editing = Boolean(editingAppKey);
                        const restoreButton = setButtonBusy(submitButton, editing ? 'Salvando...' : 'Cadastrando...');
                        if (formFeedback) formFeedback.hidden = true;
                        const payload = {
                            name: nameInput.value.trim(),
                            description: descriptionInput.value.trim(),
                            price: Number(priceInput.value) || 0,
