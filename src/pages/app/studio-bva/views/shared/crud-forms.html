<template id="studio-form-lead">
  <form class="studio-form crud-form" data-entity="lead">
    <header class="studio-dialog-header"><div><span class="studio-console-kicker">CRM · Radar</span><h2>Lead B2B</h2><p>Cadastre ou atualize a empresa mapeada no trabalho externo.</p></div><button type="button" data-close aria-label="Fechar formulário">×</button></header>
    <fieldset><legend>Identificação</legend><div class="studio-form-grid two"><label>Instituição / Empresa *<input name="name" required placeholder="Ex.: Clínica NeuroKids"></label><label>Segmento *<select name="category" required><option value="Clinicas">Clínicas e terapias</option><option value="Escolas">Escolas e colégios</option><option value="Lojas">Lojas de brinquedos</option><option value="Buffets">Buffets e festas</option><option value="Outros">Outros</option></select></label></div><label>Endereço / região<input name="address" placeholder="Rua, bairro, cidade, UF"></label></fieldset>
    <fieldset><legend>Contato e evolução</legend><div class="studio-form-grid three"><label>WhatsApp<input name="whatsapp" inputmode="tel"></label><label>Telefone<input name="phone" inputmode="tel"></label><label>Instagram<input name="instagram" placeholder="@perfil"></label></div><div class="studio-form-grid three"><label>Status<select name="status"><option>Novo Lead</option><option>Contatado</option><option>Em Negociação</option><option>Parceiro</option></select></label><label>Latitude<input name="latitude" type="number" step="any"></label><label>Longitude<input name="longitude" type="number" step="any"></label></div><label>Observações do trabalho externo<textarea name="notes" rows="4" placeholder="Contexto, interesse e próximo retorno."></textarea></label></fieldset><footer class="studio-dialog-footer"><button type="button" data-close>Cancelar</button><button class="studio-refresh" type="submit">Salvar lead</button></footer>
  </form>
</template>
<template id="studio-form-consultora">
  <form class="studio-form crud-form" data-entity="consultora"><header class="studio-dialog-header"><div><span class="studio-console-kicker">Equipe</span><h2>Consultora / revendedora</h2><p>Defina dados de contato, nível e acesso ao catálogo.</p></div><button type="button" data-close aria-label="Fechar formulário">×</button></header><fieldset><legend>Conta e contato</legend><label>Nome completo *<input name="nome" required autocomplete="name"></label><label>E-mail *<input name="email" type="email" required autocomplete="email"></label><label>Senha inicial <input name="password" type="password" autocomplete="new-password"><small>Deixe em branco para geração server-side.</small></label><div class="studio-form-grid two"><label>WhatsApp<input name="whatsapp" inputmode="tel"></label><label>Instagram<input name="instagram" placeholder="@handle"></label></div><div class="studio-form-grid two"><label>Cidade / Estado<input name="cidade"></label><label>Nível<select name="nivel"><option>Prata</option><option>Ouro</option><option>Diamante</option></select></label></div></fieldset><fieldset><legend>Permissões</legend><div class="studio-form-grid two"><label>Perfil<select name="role"><option value="viewer">Consultora · visualizar catálogo</option><option value="editor">Editora · editar produtos</option><option value="owner">Gestora · acesso total</option></select></label><label>Status<select name="status"><option value="active">Ativa</option><option value="inactive">Bloqueada</option></select></label></div></fieldset><footer class="studio-dialog-footer"><button type="button" data-close>Cancelar</button><button class="studio-refresh" type="submit">Salvar consultora</button></footer></form>
</template>
<template id="studio-form-produto"><form class="studio-form crud-form" data-entity="produto"><header class="studio-dialog-header"><div><span class="studio-console-kicker">ERP · Catálogo</span><h2>Produto 3D</h2><p>Dados de fabricação, preço, mídia e visibilidade da vitrine.</p></div><button type="button" data-close aria-label="Fechar formulário">×</button></header><fieldset><legend>Dados essenciais</legend><div class="studio-form-grid two"><label>Nome da peça *<input name="nome" required></label><label>Categoria *<input name="categoria" required></label></div><div class="studio-form-grid three"><label>Peso total (g)<input name="pesoGramas" type="number" step="any" min="0.01"><small>Em produto de um material, este valor atualiza o consumo automaticamente.</small></label><label>Tempo de impressão (h)<input name="tempoHoras" type="number" step="any" min="0"></label><label>Estoque acabado<input name="estoqueAcabado" type="number" min="0"></label></div><div class="studio-materials" data-studio-filamentos><div class="studio-materials-heading"><strong>Filamentos e cores *</strong><button type="button" class="crud-action" data-add-filamento>Adicionar filamento</button></div><p class="studio-field-hint">Selecione cada material e informe o consumo, em gramas, por unidade fabricada.</p><div data-filamento-rows></div></div><div class="studio-form-grid two"><label>Embalagem / acessório<select name="embalagemId" data-studio-embalagens></select></label><label>Máquina utilizada<select name="maquinaId" data-studio-maquinas></select></label></div></fieldset><fieldset><legend>Precificação</legend><div class="studio-form-grid four"><label>Margem atacado (%)<input name="margemAtacado" type="number" step="any" min="0"></label><label>Preço atacado (R$)<input name="precoAtacado" type="number" step="0.01" readonly></label><label>Margem varejo (%)<input name="margemVarejo" type="number" step="any" min="0"></label><label>Preço varejo (R$)<input name="precoVarejo" type="number" step="0.01" readonly></label></div><output class="studio-cost-preview">O servidor calcula custo e preços com os insumos e margens informados.</output></fieldset><fieldset><legend>Fotos, vídeos e anexos</legend><label>Fotos do produto<input name="images" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple></label><label>Vídeos (YouTube, Instagram ou TikTok)<textarea name="videos" rows="2" placeholder="Uma URL por linha"></textarea></label><label>Anexos técnicos<input name="attachments" type="file" multiple><small>STL, PDF, ZIP e outros arquivos; máximo de 80 MB por anexo.</small></label></fieldset><fieldset><legend>Vitrine</legend><label class="studio-switch"><input name="visivelNaVitrine" type="checkbox" checked> Exibir na loja pública</label><label class="studio-switch"><input name="articulado" type="checkbox"> Peça 100% articulada</label></fieldset><footer class="studio-dialog-footer"><button type="button" data-close>Cancelar</button><button class="studio-refresh" type="submit">Salvar produto</button></footer></form></template>
