<style>
    /* Anúncios / iframes no meio do artigo */
    .blog-content .adsbygoogle,
    .blog-content ins.adsbygoogle,
    .ad-sidebar-slot .adsbygoogle,
    .ad-sidebar-slot ins.adsbygoogle,
    .ad-inline-slot .adsbygoogle,
    .ad-inline-slot ins.adsbygoogle {
        display: block !important;
        margin: 1.75rem auto;
        max-width: 100% !important;
        min-height: 90px;
        overflow: hidden !important;
        text-align: center;
    }
    .ad-sidebar-slot .adsbygoogle,
    .ad-sidebar-slot ins.adsbygoogle {
        margin: 0 auto;
        width: 100% !important;
    }
    .blog-content iframe,
    .ad-sidebar-slot iframe,
    .ad-inline-slot iframe {
        max-width: 100% !important;
        overflow: hidden !important;
    }

    .ad-sidebar-slot, .ad-inline-slot {
        overflow: hidden !important;
        position: relative;
    }

    /* Sidebars de anúncios no detalhe do post */
    .blog-ads-sidebar {
        display: none;
        align-self: stretch;
    }

    .ad-sidebar-slot {
        min-height: 280px;
        border: none;
        padding: 0;
        background: transparent;
    }

    .ad-sidebar-slot.is-sticky {
        position: -webkit-sticky;
        position: sticky;
        top: 100px;
        z-index: 2;
    }

    .ad-slot-label {
        display: block;
        font-size: 0.65rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ms-on-surface-variant);
        margin-bottom: 0.35rem;
    }

    .ad-inline-slot {
        min-height: 90px;
        border: none;
        padding: 0;
        margin: 1.75rem 0;
        background: transparent;
    }

    /* Sticky nas laterais: não usar transform/filter no #post-content (ex.: Animate.css quebra sticky) */
    #post-content {
        transform: none;
        filter: none;
    }

    /* Post: rails no fluid da viewport; texto + inline só no container-lg */
    #post-content .blog-post-fluid-breakout {
        width: 100vw;
        max-width: 100vw;
        margin-left: calc(50% - 50vw);
        margin-right: calc(50% - 50vw);
        position: relative;
        box-sizing: border-box;
    }

    @media (min-width: 1200px) {
        .blog-ads-sidebar {
            display: block;
        }

        .blog-ads-sidebar--left {
            padding-right: 1.75rem;
        }

        .blog-ads-sidebar--right {
            padding-left: 1.75rem;
        }
    }

    /* body overflow-x:hidden global quebra position:sticky no viewport */
    html.blog-post-detail-open,
    body.blog-post-detail-open {
        overflow-x: clip;
    }

    /* Foreground and surfaces track the selected theme without rerendering. */
    #blog-filters .btn.btn-outline-light,
    #post-content .btn.btn-outline-light {
        border-color: var(--ms-outline);
        color: var(--ms-on-surface);
    }
    #blog-filters .btn.btn-outline-light:hover,
    #blog-filters .btn.btn-outline-light:focus-visible,
    #post-content .btn.btn-outline-light:hover,
    #post-content .btn.btn-outline-light:focus-visible {
        border-color: var(--ms-primary);
        color: var(--ms-on-surface);
        background: var(--ms-surface-container-high);
    }
    #blog-filters .btn.btn-outline-light.active {
        background: var(--ms-primary-container);
        border-color: var(--ms-primary-container);
        color: var(--ms-on-primary-container);
    }

    .blog-content :is(h1, h2, h3, h4, h5, h6) {
        color: var(--ms-on-surface);
    }

    .blog-content a {
        color: var(--ms-primary);
    }

    #post-content .blog-share-whatsapp {
        border-color: var(--ms-tertiary);
        color: var(--ms-tertiary);
    }

    #post-content .blog-share-facebook {
        border-color: var(--ms-primary);
        color: var(--ms-primary);
    }

    .blog-category-badge {
        background-color: rgba(13, 110, 253, 0.92) !important;
        color: #fff !important;
    }

    .blog-tag-badge {
        background: var(--ms-surface-container-high);
        color: var(--ms-on-surface);
    }
</style>

<script>
    (function () {
        const grid = document.getElementById('blog-grid');
        const filterContainer = document.getElementById('blog-filters');
        const filterRow = document.getElementById('blog-filter-row');
        const heroTitle = document.querySelector('.dev-hero-title');
        const heroSubtitle = document.querySelector('.dev-hero-subtitle');
        const api = window.config?.api?.baseUrl || 'http://127.0.0.1:3000';

        const ADSENSE_CLIENT = 'ca-pub-7844284078845131';
        const ADSENSE_SLOT_BLOG_POST = '4406317970';
        const ADSENSE_SLOT_BLOG_VERTICAL = '6976640993';

        const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
        function safeUrl(value, image = false) {
            const raw = String(value || '').trim();
            try {
                const url = new URL(raw, window.location.origin);
                if (!['http:', 'https:'].includes(url.protocol)) return '';
                if (image && !raw.startsWith('/') && !/^https?:\/\//i.test(raw)) return '';
                return url.href;
            } catch (_) { return ''; }
        }
        function sanitizeArticleHtml(raw) {
            const template = document.createElement('template');
            template.innerHTML = String(raw || '');
            const allowed = new Set(['P', 'BR', 'STRONG', 'B', 'EM', 'I', 'U', 'S', 'DEL', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'UL', 'OL', 'LI', 'BLOCKQUOTE', 'PRE', 'CODE', 'A', 'IMG', 'FIGURE', 'FIGCAPTION', 'DIV', 'SPAN', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TH', 'TD', 'HR', 'INS']);
            const allowedStyles = new Set(['color', 'background-color', 'text-align', 'font-size', 'font-weight', 'font-style', 'text-decoration', 'margin-left', 'margin-right']);
            for (const element of [...template.content.querySelectorAll('*')]) {
                if (!allowed.has(element.tagName)) { element.remove(); continue; }
                for (const attribute of [...element.attributes]) {
                    const name = attribute.name.toLowerCase();
                    if (name === 'style') {
                        const clean = [...element.style].filter(property => allowedStyles.has(property) && !/[;<>]|url\(|expression\(|@import/i.test(element.style.getPropertyValue(property))).map(property => `${property}:${element.style.getPropertyValue(property)}`).join(';');
                        if (clean) element.setAttribute('style', clean);
                        else element.removeAttribute('style');
                    } else if (name === 'href' && element.tagName === 'A') {
                        const href = safeUrl(attribute.value);
                        if (href) element.setAttribute('href', href);
                        else element.removeAttribute('href');
                    } else if (name === 'src' && element.tagName === 'IMG') {
                        const src = safeUrl(attribute.value, true);
                        if (src) element.setAttribute('src', src);
                        else element.remove();
                    } else if (!['class', 'title', 'alt', 'width', 'height', 'colspan', 'rowspan', 'loading', 'target', 'rel', 'data-ms-ad-marker'].includes(name)) element.removeAttribute(attribute.name);
                }
                if (element.tagName === 'A' && element.getAttribute('target') === '_blank') element.setAttribute('rel', 'noopener noreferrer');
            }
            return template.innerHTML;
        }

        let sidebarAdsGeneration = 0;

        function ensureAdsenseScript() {            if (document.getElementById('adsense-script-blog')) return;
            const s = document.createElement('script');
            s.id = 'adsense-script-blog';
            s.async = true;
            s.src = `https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=${encodeURIComponent(ADSENSE_CLIENT)}`;
            s.crossOrigin = 'anonymous';
            document.head.appendChild(s);
        }

        function appendAdSenseUnit(containerEl, adSlot) {
            if (!containerEl || containerEl.querySelector('ins.adsbygoogle')) return;
            const ins = document.createElement('ins');
            ins.className = 'adsbygoogle';
            ins.style.display = 'block';
            ins.setAttribute('data-ad-client', ADSENSE_CLIENT);
            ins.setAttribute('data-ad-slot', adSlot);
            ins.setAttribute('data-ad-format', 'auto');
            ins.setAttribute('data-full-width-responsive', 'true');
            containerEl.appendChild(ins);
        }

        function pushAdsenseSlots(root) {
            if (!root) return;
            root.querySelectorAll('ins.adsbygoogle:not([data-adsense-pushed])').forEach((ins) => {
                ins.setAttribute('data-adsense-pushed', '1');
                try {
                    (window.adsbygoogle = window.adsbygoogle || []).push({});
                } catch (e) {
                    console.warn('Adsense push failed', e);
                }
            });
        }

        function mountBlogPostInlineAds(container) {
            if (!container) return;
            ensureAdsenseScript();
            container.querySelectorAll('.blog-content ins.adsbygoogle').forEach((ins) => {
                ins.setAttribute('data-ad-client', ADSENSE_CLIENT);
                ins.setAttribute('data-ad-slot', ADSENSE_SLOT_BLOG_POST);
                ins.setAttribute('data-ad-format', 'auto');
                ins.setAttribute('data-full-width-responsive', 'true');
            });
            container.querySelectorAll('.ad-inline-content').forEach((el) => {
                appendAdSenseUnit(el, ADSENSE_SLOT_BLOG_POST);
            });
            pushAdsenseSlots(container);
        }

        function mountBlogPostSidebarAds(container) {
            ensureAdsenseScript();
            container.querySelectorAll('.ad-sidebar-content').forEach((el) => {
                appendAdSenseUnit(el, ADSENSE_SLOT_BLOG_VERTICAL);
            });
            pushAdsenseSlots(container);
        }

        // Check for slug in params
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        // segment[0] is 'blog'. segment[1] is slug.
        const slug = pathSegments[1];

        // --- Detail View ---
        async function loadPost(slug) {
            sidebarAdsGeneration++;
            const loadGen = sidebarAdsGeneration;

            // Adjust layout for detail
            if (heroTitle) heroTitle.innerHTML = '<div class="spinner-border text-primary"></div>';
            if (heroSubtitle) heroSubtitle.style.display = 'none';

            // Clean grid container for article content
            if (grid) {
                grid.parentElement.innerHTML = '<div id="post-content"></div>';
            }
            const container = document.getElementById('post-content');

            try {
                let post = null;
                if (window.core && window.core.fetchAPI) {
                    const res = await window.core.fetchAPI(`/blogs/${slug}`);
                    if (res && res.success) post = res.data;
                } else {
                    const res = await fetch(`${api}/blogs/${slug}`);
                    const json = await res.json();
                    if (json.success) post = json.data;
                }

                if (!post) throw new Error('Post not found');

                const safeContent = sanitizeArticleHtml(post.content || '');
                const coverUrl = safeUrl(post.imageUrl, true);
                const hasCoverImage = !!coverUrl;

                // SEO: meta tags dinâmicos
                const canonicalUrl = (typeof window !== 'undefined' && window.location.origin)
                    ? `${window.location.origin}/blog/${encodeURIComponent(post.slug || '')}`
                    : `https://mirandasoft.com.br/blog/${encodeURIComponent(post.slug || '')}`;
                const desc = (post.description || (post.content || '').replace(/<[^>]*>/g, '').substring(0, 160).trim() || post.title) + ' | Miranda Soft';
                const pubDate = post.createdAt ? new Date(post.createdAt).toISOString() : '';

                document.title = `${post.title} | Blog Miranda Soft`;

                const setMeta = (attr, val, prop = 'content') => {
                    const sel = attr.startsWith('og:') || attr.startsWith('twitter:') ? `meta[property="${attr}"]` : `meta[name="${attr}"]`;
                    let el = document.querySelector(sel);
                    if (!el) {
                        el = document.createElement('meta');
                        if (attr.startsWith('og:') || attr.startsWith('twitter:')) el.setAttribute('property', attr);
                        else el.setAttribute('name', attr);
                        document.head.appendChild(el);
                    }
                    el.setAttribute(prop, val || '');
                };

                setMeta('description', desc);
                setMeta('og:type', 'article');
                setMeta('og:url', canonicalUrl);
                setMeta('og:title', post.title);
                setMeta('og:description', desc);
                if (hasCoverImage) {
                    setMeta('og:image', coverUrl);
                    setMeta('twitter:image', coverUrl);
                } else {
                    const ogImg = document.querySelector('meta[property="og:image"]');
                    const twImg = document.querySelector('meta[property="twitter:image"]');
                    if (ogImg) ogImg.remove();
                    if (twImg) twImg.remove();
                }
                setMeta('og:site_name', 'Miranda Soft');
                if (pubDate) setMeta('article:published_time', pubDate);
                if (post.author) setMeta('article:author', post.author);
                setMeta('twitter:card', hasCoverImage ? 'summary_large_image' : 'summary');
                setMeta('twitter:title', post.title);
                setMeta('twitter:description', desc);

                const linkCanonical = document.querySelector('link[rel="canonical"]') || document.createElement('link');
                linkCanonical.rel = 'canonical';
                linkCanonical.href = canonicalUrl;
                if (!document.querySelector('link[rel="canonical"]')) document.head.appendChild(linkCanonical);

                const jsonLd = {
                    '@context': 'https://schema.org',
                    '@type': 'Article',
                    headline: post.title,
                    description: desc,
                    ...(hasCoverImage && { image: coverUrl }),
                    datePublished: pubDate,
                    dateModified: (post.updatedAt ? new Date(post.updatedAt).toISOString() : pubDate),
                    author: { '@type': 'Person', name: post.author || 'Miranda Soft' },
                    publisher: { '@type': 'Organization', name: 'Miranda Soft', url: 'https://mirandasoft.com.br' },
                    mainEntityOfPage: { '@type': 'WebPage', '@id': canonicalUrl }
                };
                let scriptLd = document.getElementById('blog-jsonld');
                if (scriptLd) scriptLd.remove();
                scriptLd = document.createElement('script');
                scriptLd.id = 'blog-jsonld';
                scriptLd.type = 'application/ld+json';
                scriptLd.textContent = JSON.stringify(jsonLd);
                document.head.appendChild(scriptLd);

                // Render Hero Metadata
                if (heroTitle) {
                    heroTitle.innerHTML = `
                        ${escapeHtml(post.title)} <br>
                        <span class="fs-5 text-on-surface-variant fw-normal mt-3 d-block">Por ${escapeHtml(post.author)} • ${new Date(post.createdAt).toLocaleDateString('pt-BR')}</span>
                    `;
                }

                // Render Content: verticais no fluid; texto + anúncios inline só no container-lg
                container.innerHTML = `
                    <div class="blog-post-fluid-breakout">
                        <div class="container-fluid blog-post-fluid-inner px-2 px-sm-3 px-xl-4">
                            <div class="row align-items-stretch justify-content-center g-0">
                                <aside class="col-xl-2 blog-ads-sidebar blog-ads-sidebar--left">
                                    <div class="ad-sidebar-slot is-sticky" data-ad-position="left" data-ad-slot="${ADSENSE_SLOT_BLOG_VERTICAL}">
                                        <span class="ad-slot-label">Publicidade</span>
                                        <!-- blog-post-vertical: lateral esquerda -->
                                        <div class="ad-sidebar-content" id="ad-sidebar-left"></div>
                                    </div>
                                </aside>
                                <div class="col-12 col-lg-11 col-xl-8 animate__animated animate__fadeInUp">
                                    <article class="container-lg mx-auto px-3 px-lg-4 blog-post-text-wrap" itemscope itemtype="https://schema.org/Article">
                                        ${hasCoverImage ? `<header class="mb-5"><img src="${escapeHtml(coverUrl)}" class="w-100 rounded-3 mb-4 shadow" alt="${escapeHtml(post.title)}" itemprop="image" loading="lazy"></header>` : ''}
                                        <div class="blog-content pb-4 text-on-surface" style="line-height: 1.8; font-size: 1.15rem;" itemprop="articleBody" data-inline-ads="enabled">
                                            ${safeContent || '<p class="text-muted">Sem conteúdo disponível.</p>'}
                                        </div>
                                        <hr class="border-secondary mt-5 mb-4 opacity-25">
                                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-4 mt-4">
                                            <div>
                                                <a href="/blog" class="btn btn-outline-light rounded-pill px-4"><i class="bi bi-arrow-left me-2"></i> Voltar ao Blog</a>
                                            </div>
                                            <div class="d-flex gap-2 align-items-center flex-wrap">
                                                <span class="text-muted small me-2"><i class="bi bi-tags"></i> Tags:</span>
                                                ${(post.tags && post.tags.length > 0) ? post.tags.map(t => `<span class="badge blog-tag-badge">${escapeHtml(t)}</span>`).join('') : '<span class="text-muted small">Nenhuma tag</span>'}
                                            </div>
                                        </div>
                                        <div class="mt-4 pt-4 border-top border-secondary border-opacity-25">
                                            <p class="text-on-surface mb-3 fw-bold">Compartilhe este artigo na sua rede:</p>
                                            <div class="d-flex gap-3 flex-wrap">
                                                <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(post.title)}&url=${encodeURIComponent(window.location.href)}" target="_blank" class="btn btn-outline-light rounded-circle" style="width: 45px; height: 45px; display: flex; align-items: center; justify-content: center;"><i class="bi bi-twitter-x"></i></a>
                                                <a href="https://www.linkedin.com/shareArticle?mini=true&title=${encodeURIComponent(post.title)}&url=${encodeURIComponent(window.location.href)}" target="_blank" class="btn btn-outline-light rounded-circle" style="width: 45px; height: 45px; display: flex; align-items: center; justify-content: center;"><i class="bi bi-linkedin"></i></a>
                                                <a href="https://api.whatsapp.com/send?text=${encodeURIComponent('Acabei de ler esse conteúdo incrível no MSOFT: ' + post.title + ' ' + window.location.href)}" target="_blank" class="btn btn-outline-light rounded-circle blog-share-whatsapp" style="width: 45px; height: 45px; display: flex; align-items: center; justify-content: center;"><i class="bi bi-whatsapp"></i></a>
                                                <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}" target="_blank" class="btn btn-outline-light rounded-circle blog-share-facebook" style="width: 45px; height: 45px; display: flex; align-items: center; justify-content: center;"><i class="bi bi-facebook"></i></a>
                                            </div>
                                        </div>
                                    </article>
                                </div>
                                <aside class="col-xl-2 blog-ads-sidebar blog-ads-sidebar--right">
                                    <div class="ad-sidebar-slot is-sticky" data-ad-position="right" data-ad-slot="${ADSENSE_SLOT_BLOG_VERTICAL}">
                                        <span class="ad-slot-label">Publicidade</span>
                                        <!-- blog-post-vertical: lateral direita -->
                                        <div class="ad-sidebar-content" id="ad-sidebar-right"></div>
                                    </div>
                                </aside>
                            </div>
                        </div>
                    </div>
                `;

                const articleBody = container.querySelector('.blog-content');
                if (articleBody) {
                    injectInlineAdSlots(articleBody, post.content || '');
                }
                document.documentElement.classList.add('blog-post-detail-open');
                document.body.classList.add('blog-post-detail-open');

                mountBlogPostInlineAds(container);
                const root = document.getElementById('post-content');
                if (loadGen === sidebarAdsGeneration) {
                    mountBlogPostSidebarAds(root);
                }

            } catch (e) {
                console.error(e);
                clearSidebarAdSchedule();
                document.documentElement.classList.remove('blog-post-detail-open');
                document.body.classList.remove('blog-post-detail-open');
                if (heroTitle) heroTitle.innerHTML = 'Post não encontrado';
                if (container) container.innerHTML = '<div class="text-center"><a href="/blog" class="btn btn-primary">Voltar para o Blog</a></div>';
            }
        }

        function injectInlineAdSlots(articleBody, rawContent) {
            const explicitMode = String(rawContent).match(/<!--\s*msoft:inline-ads:(manual|none)\s*-->/i)?.[1]?.toLowerCase();
            const markers = Array.from(articleBody.querySelectorAll('[data-ms-ad-marker="inline"]'));
            if (explicitMode === 'none') {
                markers.forEach(marker => marker.remove());
                articleBody.querySelectorAll('ins.adsbygoogle, .ad-inline-slot').forEach(ad => ad.remove());
                return;
            }
            if (explicitMode === 'manual' || markers.length) {
                articleBody.querySelectorAll('ins.adsbygoogle, .ad-inline-slot').forEach(ad => ad.remove());
                markers.forEach((marker, index) => {
                    const slot = createInlineAdSlot(index + 1);
                    marker.replaceWith(slot);
                });
                return;
            }
            // Artigos legados com bloco de anúncio próprio não recebem unidades extras.
            if (articleBody.querySelector('ins.adsbygoogle, .ad-inline-slot')) return;
            const paragraphSelector = 'p, .ql-align-justify';
            const paragraphs = Array.from(articleBody.querySelectorAll(paragraphSelector));
            if (paragraphs.length < 3) return;

            const insertionIndexes = [2, 5, 8].filter((idx) => idx < paragraphs.length);
            insertionIndexes.forEach((paragraphIndex, slotIndex) => {
                const referenceParagraph = paragraphs[paragraphIndex];
                if (!referenceParagraph || referenceParagraph.nextElementSibling?.classList.contains('ad-inline-slot')) {
                    return;
                }

                const slot = createInlineAdSlot(slotIndex + 1);
                referenceParagraph.insertAdjacentElement('afterend', slot);
            });
        }

        function createInlineAdSlot(index) {
            const slot = document.createElement('div');
            slot.className = 'ad-inline-slot';
            slot.setAttribute('data-ad-position', `inline-${index}`);
            slot.setAttribute('data-ad-slot', ADSENSE_SLOT_BLOG_POST);
            slot.innerHTML = `<span class="ad-slot-label">Publicidade</span><div class="ad-inline-content" id="ad-inline-${index}"></div>`;
            return slot;
        }

        function resetBlogMeta() {
            document.title = 'Blog & Insights | Miranda Soft';
            const def = {
                description: 'Fique por dentro das últimas novidades sobre Apps White Label, tendências tech e dicas para impulsionar sua produtividade.',
                'og:type': 'website', 'og:url': 'https://mirandasoft.com.br/blog', 'og:title': 'Blog | Miranda Soft', 'og:description': 'Insights sobre tecnologia e produtividade.',
                'twitter:card': 'summary_large_image', 'twitter:title': 'Blog | Miranda Soft', 'twitter:description': 'Insights sobre tecnologia e produtividade.'
            };
            const setMeta = (attr, val) => {
                const sel = attr.startsWith('og:') || attr.startsWith('twitter:') ? `meta[property="${attr}"]` : `meta[name="${attr}"]`;
                const el = document.querySelector(sel);
                if (el) el.setAttribute('content', val || '');
            };
            Object.entries(def).forEach(([k, v]) => setMeta(k, v));
            const ld = document.getElementById('blog-jsonld');
            if (ld) ld.remove();
        }

        // --- List View ---
        async function loadBlogs() {
            if (!grid) return;
            sidebarAdsGeneration++;
            document.documentElement.classList.remove('blog-post-detail-open');
            document.body.classList.remove('blog-post-detail-open');
            resetBlogMeta();
            grid.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div></div>';

            const normalizeCategory = (value) => (value || '').toString().trim().toLocaleLowerCase('pt-BR');
            const getPostCategories = (post) => {
                const categories = Array.isArray(post.categories) && post.categories.length ? post.categories : [post.category];
                return categories
                    .map((category) => (typeof category === 'object' ? category?.name : category))
                    .map((category) => (category || '').toString().trim())
                    .filter(Boolean);
            };
            let selectedFilter = normalizeCategory(new URLSearchParams(window.location.search).get('categoria')) || 'todos';
            let allPosts = [];

            try {
                if (window.core && window.core.fetchAPI) {
                    const res = await window.core.fetchAPI('/blogs');
                    if (res && res.success && Array.isArray(res.data)) allPosts = res.data;
                } else {
                    const res = await fetch(`${api}/blogs`);
                    const json = await res.json();
                    if (json.success && Array.isArray(json.data)) allPosts = json.data;
                }
            } catch (e) {
                console.warn('Failed to load blogs from API', e);
            }

            if (allPosts.length === 0) {
                grid.innerHTML = '<div class="col-12 text-center text-muted py-5">Nenhuma postagem encontrada.</div>';
                return;
            }

            const renderPosts = () => {
                const posts = selectedFilter === 'todos'
                    ? allPosts
                    : allPosts.filter((post) => getPostCategories(post).some(
                        (category) => normalizeCategory(category) === selectedFilter
                    ));

                if (posts.length === 0) {
                    grid.innerHTML = '<div class="col-12 text-center text-muted py-5">Nenhuma postagem nessa categoria.</div>';
                    return;
                }

                grid.innerHTML = posts.map((post, index) => {
                    const date = new Date(post.createdAt || Date.now()).toLocaleDateString('pt-BR', { day: 'numeric', month: 'short', year: 'numeric' });
                    const imageUrl = safeUrl(post.imageUrl, true);
                    const hasImage = !!imageUrl;
                    const postUrl = `/blog/${encodeURIComponent(post.slug || '')}`;
                    const summary = post.description || (post.content || '').replace(/<[^>]*>/g, '').substring(0, 120).trim();

                    return `
                    <div class="col-md-6 col-lg-4 animate-on-scroll" style="animation-delay: ${index * 0.1}s">
                    <article class="card h-100 border-0 bg-transparent text-on-surface" style="transition: transform 0.3s ease;">
                        ${hasImage ? `
                        <div class="position-relative overflow-hidden rounded-4 mb-3" style="aspect-ratio: 16/10;">
                            <img src="${escapeHtml(imageUrl)}" class="w-100 h-100 object-fit-cover" alt="${escapeHtml(post.title)}" style="transition: transform 0.5s ease;">
                            <div class="position-absolute top-0 start-0 p-3">
                                <span class="badge blog-category-badge backdrop-blur shadow-sm">${escapeHtml(post.category || 'Geral')}</span>
                            </div>
                        </div>
                        ` : `
                        <div class="d-flex align-items-center gap-2 text-muted small mb-2">
                            <span class="badge bg-primary bg-opacity-25 text-primary">${escapeHtml(post.category || 'Geral')}</span>
                            <span><i class="bi bi-calendar3"></i> ${date}</span>
                        </div>
                        `}
                        <div class="card-body p-0 ${hasImage ? '' : 'pt-2'}">
                        ${hasImage ? `<div class="d-flex align-items-center gap-2 text-muted small mb-2">
                            <i class="bi bi-calendar3"></i> ${date}
                        </div>` : ''}
                        <h3 class="h5 fw-bold mb-2">
                            <a href="${postUrl}" class="text-on-surface text-decoration-none hover-gradient">${escapeHtml(post.title)}</a>
                        </h3>
                        <p class="text-on-surface-variant small line-clamp-3 mb-3">
                            ${escapeHtml(summary)}
                        </p>
                        <a href="${postUrl}" class="dev-link-arrow text-primary text-decoration-none small fw-semibold">
                            Ler Artigo <i class="bi bi-arrow-right"></i>
                        </a>
                        </div>
                    </div>
                    </article>
                    </div>
                `}).join('');

                // Animations
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('animate__animated', 'animate__fadeInUp');
                            observer.unobserve(entry.target);
                        }
                    });
                });
                grid.querySelectorAll('.animate-on-scroll').forEach(el => observer.observe(el));
            };

            const setupFilters = () => {
                if (!filterContainer) return;

                const categoriesByFilter = new Map();
                allPosts.forEach((post) => getPostCategories(post).forEach((category) => {
                    const filter = normalizeCategory(category);
                    if (filter && filter !== 'todos' && !categoriesByFilter.has(filter)) {
                        categoriesByFilter.set(filter, category);
                    }
                }));

                filterContainer.replaceChildren();
                const createFilterButton = (filter, label, isActive = false) => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = `btn btn-outline-light rounded-pill px-4${isActive ? ' active' : ''}`;
                    button.setAttribute('data-filter', filter);
                    button.textContent = label;
                    filterContainer.appendChild(button);
                };

                if (!categoriesByFilter.has(selectedFilter)) selectedFilter = 'todos';
                createFilterButton('todos', 'Todos', selectedFilter === 'todos');
                Array.from(categoriesByFilter.entries())
                    .sort(([, firstLabel], [, secondLabel]) => firstLabel.localeCompare(secondLabel, 'pt-BR'))
                    .forEach(([filter, label]) => createFilterButton(filter, label, selectedFilter === filter));

                const buttons = filterContainer.querySelectorAll('[data-filter]');
                buttons.forEach((button) => {
                    button.addEventListener('click', () => {
                        selectedFilter = button.getAttribute('data-filter') || 'todos';
                        buttons.forEach((btn) => btn.classList.remove('active'));
                        button.classList.add('active');
                        renderPosts();
                    });
                });
                filterRow.hidden = false;
            };

            setupFilters();
            renderPosts();
        }

        // Router
        if (slug) {
            loadPost(slug);
        } else {
            loadBlogs();
        }
    })();
</script>
