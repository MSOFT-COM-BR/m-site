<style>

    .dev-header .navbar.fixed-top .navbar-collapse {
      position: absolute;
      top: calc(100% + 24px);

      border: 1px solid var(--header-menu-border);

    .dev-header .navbar-collapse.show {

    .dev-header .navbar-nav {

      gap: 4px !important;
    }

    .dev-header .navbar-collapse .nav-item {

    .dev-header .nav-link {

<script>
  (function initHeaderNavigation() {
    if (typeof window.__msoftHeaderTeardown === 'function') {
      window.__msoftHeaderTeardown();
    }

    const header = document.querySelector('.dev-header');
    const navbar = header && header.querySelector('.navbar');
    const navbarNav = header && header.querySelector('#navbarNav');
    const navToggle = header && header.querySelector('[data-mobile-nav-toggle]');
    if (!header || !navbar || !navbarNav || !navToggle) return;

    const mobileQuery = window.matchMedia('(max-width: 991.98px)');
    const languageOptions = {
      'pt-BR': { code: 'PT', flag: '🇧🇷' },
      es: { code: 'ES', flag: '🇪🇸' },
      en: { code: 'EN', flag: '🇺🇸' }
    };

    function translate(key, fallback) {
      if (window.i18n && typeof window.i18n.t === 'function') {
        return window.i18n.t(key, fallback);
      }
      return fallback;
    }

    function syncNavigationLabels() {
      const isOpen = navbarNav.classList.contains('show');
      navToggle.setAttribute('aria-label', isOpen
        ? translate('navigation.close', 'Fechar menu de navegação')
        : translate('navigation.open', 'Abrir menu de navegação'));
    }

    function renderLanguageSelector() {
      const locale = window.i18n && typeof window.i18n.getLocale === 'function'
        ? window.i18n.getLocale()
        : 'pt-BR';
      const info = window.i18n && typeof window.i18n.getLocaleInfo === 'function'
        ? window.i18n.getLocaleInfo(locale)
        : languageOptions[locale] || languageOptions['pt-BR'];
      const languageName = translate(`language.${locale}`, locale);
      const languageToggle = header.querySelector('[data-language-toggle]');
      const currentFlag = header.querySelector('[data-language-current-flag]');
      const currentCode = header.querySelector('[data-language-current-code]');

      if (currentFlag) currentFlag.textContent = info.flag;
      if (currentCode) currentCode.textContent = info.code;
      if (languageToggle) {
        const label = `${translate('language.select', 'Selecionar idioma')}: ${languageName}`;
        languageToggle.setAttribute('aria-label', label);
        languageToggle.setAttribute('title', label);
      }

      header.querySelectorAll('[data-language-option]').forEach((option) => {
        const selected = option.getAttribute('data-language-option') === locale;
        option.classList.toggle('active', selected);
        option.setAttribute('aria-pressed', String(selected));
      });
    }

    function closeHeaderDropdowns() {
      const dropdownToggles = header.querySelectorAll('[data-bs-toggle="dropdown"]');
      const dropdownMenus = header.querySelectorAll('.dropdown-menu.show');
      dropdownToggles.forEach((dropdownToggle) => {
        if (window.bootstrap && window.bootstrap.Dropdown) {
          const instance = window.bootstrap.Dropdown.getInstance(dropdownToggle);
          if (instance) instance.hide();
        }
        dropdownToggle.setAttribute('aria-expanded', 'false');
      });
      dropdownMenus.forEach((dropdownMenu) => dropdownMenu.classList.remove('show'));
    }

    function setMenuOpen(open, restoreFocus = false) {
      const shouldOpen = Boolean(open && mobileQuery.matches);
      navbarNav.classList.toggle('show', shouldOpen);
      navbar.classList.toggle('mobile-menu-open', shouldOpen);
      navToggle.setAttribute('aria-expanded', String(shouldOpen));
      syncNavigationLabels();
      if (!shouldOpen) closeHeaderDropdowns();
      if (!shouldOpen && restoreFocus) navToggle.focus({ preventScroll: true });
    }

    function handleToggle(event) {
      event.preventDefault();
      setMenuOpen(!navbarNav.classList.contains('show'));
    }

    function handleOutsidePointer(event) {
      if (!mobileQuery.matches || !navbarNav.classList.contains('show')) return;
      if (navbarNav.contains(event.target) || navToggle.contains(event.target)) return;
      setMenuOpen(false);
    }

    function handleKeydown(event) {
      if (event.key !== 'Escape' || !mobileQuery.matches || !navbarNav.classList.contains('show')) return;
      event.preventDefault();
      setMenuOpen(false, true);
    }

    function handleNavigationClick(event) {
      if (!mobileQuery.matches || !(event.target instanceof Element)) return;
      const link = event.target.closest('a[href]');
      if (link) {
        const href = link.getAttribute('href') || '';
        if (href !== '#' && !href.startsWith('javascript:') && !link.hasAttribute('data-bs-toggle')) {
          setMenuOpen(false);
        }
        return;
      }
      if (event.target.closest('button.dropdown-item')) setMenuOpen(false);
    }

    function handleLanguageSelection(event) {
      if (!(event.target instanceof Element)) return;
      const option = event.target.closest('[data-language-option]');
      if (!option || !header.contains(option)) return;
      const locale = option.getAttribute('data-language-option');
      if (window.i18n && typeof window.i18n.setLocale === 'function') {
        window.i18n.setLocale(locale);
      }
      closeHeaderDropdowns();
    }

    function handleLocaleChange() {
      renderLanguageSelector();
      syncNavigationLabels();
    }

    function handleViewportChange() {
      if (!mobileQuery.matches) setMenuOpen(false);
    }

    function handleScroll() {
      navbar.classList.toggle('scrolled', window.scrollY > 50);
    }

    navToggle.addEventListener('click', handleToggle);
    navbarNav.addEventListener('click', handleNavigationClick);
    header.addEventListener('click', handleLanguageSelection);
    document.addEventListener('pointerdown', handleOutsidePointer);
    document.addEventListener('keydown', handleKeydown);
    window.addEventListener('scroll', handleScroll, { passive: true });
    window.addEventListener('i18n:locale-change', handleLocaleChange);
    if (typeof mobileQuery.addEventListener === 'function') {
      mobileQuery.addEventListener('change', handleViewportChange);
    } else {
      mobileQuery.addListener(handleViewportChange);
    }
    renderLanguageSelector();
    syncNavigationLabels();
    handleScroll();

    window.__msoftHeaderTeardown = function () {
      navToggle.removeEventListener('click', handleToggle);
      navbarNav.removeEventListener('click', handleNavigationClick);
      header.removeEventListener('click', handleLanguageSelection);
      document.removeEventListener('pointerdown', handleOutsidePointer);
      document.removeEventListener('keydown', handleKeydown);
      window.removeEventListener('scroll', handleScroll);
      window.removeEventListener('i18n:locale-change', handleLocaleChange);
      if (typeof mobileQuery.removeEventListener === 'function') {
        mobileQuery.removeEventListener('change', handleViewportChange);
      } else {
        mobileQuery.removeListener(handleViewportChange);
      }
    };
  })();

  // Auth Header Logic
  (function updateHeaderAuth() {
    const headerAuthItem = document.getElementById('header-auth-action');
    if (!headerAuthItem) return;

    // Check immediately
    render();

    // Listen for changes
    window.addEventListener('auth-change', render);

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[character]);
    }

    function render() {
      const auth = window.authService;
      const contactAction = document.getElementById('header-contact-action');
      const isAuthenticated = auth && auth.isAuthenticated();
      
      if (contactAction) {
          contactAction.style.display = isAuthenticated ? 'none' : 'block';
      }

      if (isAuthenticated) {
        headerAuthItem.style.display = 'block';
        const user = auth.getUser();
        const userName = user && typeof user.name === 'string' && user.name.trim()
          ? escapeHtml(user.name.trim().split(/\s+/)[0])
          : '';
        let menuItems = '';

        const isActive = (path) => window.location.pathname.startsWith(path) ? 'active bg-primary' : '';

        if (auth.hasRole('admin')) {
          menuItems += `<li><a class="dropdown-item text-white ${isActive('/admin')}" href="/admin"><i class="bi bi-shield-lock me-2"></i><span data-i18n="account.admin">Painel Admin</span></a></li>`;
        }

        if (auth.hasRole('premium')) {
          menuItems += `<li><a class="dropdown-item text-white ${isActive('/premium')}" href="/premium"><i class="bi bi-star-fill me-2"></i><span data-i18n="account.premium">Dashboard Premium</span></a></li>`;
        }

        if (!auth.hasRole('admin') && !auth.hasRole('premium')) {
          menuItems += `<li><a class="dropdown-item text-white ${isActive('/premium')}" href="/premium"><i class="bi bi-speedometer2 me-2"></i><span data-i18n="account.dashboard">Dashboard</span></a></li>`;
        }

        headerAuthItem.innerHTML = `
          <div class="dropdown">
            <button class="header-user-btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Menu da conta" data-i18n-aria-label="account.menu">
              <i class="bi bi-person-circle flex-shrink-0" aria-hidden="true"></i>
              <span class="header-user-name"${userName ? '' : ' data-i18n="account.default"'}>${userName || 'Conta'}</span>
              <i class="bi bi-chevron-down header-user-caret" aria-hidden="true"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end bg-dark border-secondary shadow-lg">
              <li class="dropdown-header text-muted small text-uppercase" data-i18n="account.accesses">Meus acessos</li>
              ${menuItems}
              <li><hr class="dropdown-divider bg-secondary"></li>
              <li><a class="dropdown-item text-white" href="/profile"><i class="bi bi-person-gear me-2"></i><span data-i18n="account.profile">Meu perfil</span></a></li>
              <li><button class="dropdown-item text-danger" onclick="window.authService.logout()"><i class="bi bi-box-arrow-right me-2"></i><span data-i18n="account.logout">Sair</span></button></li>
            </ul>
          </div>
        `;
        if (window.i18n && typeof window.i18n.apply === 'function') {
          window.i18n.apply(headerAuthItem);
        }
      } else {
        headerAuthItem.innerHTML = '';
        headerAuthItem.style.display = 'none';
      }
    }
  })();
</script>
